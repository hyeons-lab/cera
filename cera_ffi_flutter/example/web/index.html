<html>
<head>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="cera_ffi_flutter_example">

  <title>Cera</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #0b0c0e;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>
  <script>
    window.ceraDecodeAudioBlob = async function(blobUrl, targetSr) {
      try {
        const res = await fetch(blobUrl);
        const buf = await res.arrayBuffer();
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx({ sampleRate: targetSr || 16000 });
        try {
          if (ctx.state === 'suspended') {
            await ctx.resume();
          }
          const decoded = await ctx.decodeAudioData(buf);
          const chan = decoded.getChannelData(0);
          return new Float32Array(chan);
        } finally {
          if (ctx.state !== 'closed') ctx.close();
        }
      } catch (err) {
        console.error('[cera:audio] decodeAudioData failed:', err);
        throw err;
      }
    };

    let activeAudioSource = null;
    let activeAudioCtx = null;
    let activeStreamer = null;

    class CeraAudioStreamer {
      constructor(sampleRate = 24000) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx({ sampleRate });
        this.sampleRate = sampleRate;
        this.isPlaying = true;
        this.queue = [];
        this.totalDurationQueued = 0;
        this.firstChunkTime = null;
        this.nextStartTime = 0;
        this.startedPlaying = false;
        if (this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
        console.info(`[cera:audio] dynamic streamer started at ${sampleRate}Hz`);
      }

      appendChunk(raw) {
        if (!this.isPlaying || !raw) return;
        if (this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
        const data = raw instanceof Float32Array ? raw : new Float32Array(raw);
        if (data.length === 0) return;

        const duration = data.length / this.sampleRate;
        const nowMs = performance.now();
        if (this.firstChunkTime === null) {
          this.firstChunkTime = nowMs;
        }

        this.queue.push(data);
        this.totalDurationQueued += duration;

        // Compute generation Real-Time Factor (RTF)
        const elapsedSec = (nowMs - this.firstChunkTime) / 1000.0;
        const rtf = elapsedSec > 0.05 ? (this.totalDurationQueued / elapsedSec) : 1.0;

        // Adaptive pre-buffering to guarantee zero underrun stutters:
        // - Faster than real-time (RTF >= 1.0): start after 0.25s of audio.
        // - Slower than real-time (RTF < 1.0): wait until bufferedAudio >= elapsedSec * (1.0 - RTF).
        if (!this.startedPlaying) {
          const ready = rtf >= 1.0
            ? (this.totalDurationQueued >= 0.25)
            : (this.totalDurationQueued >= (elapsedSec * (1.0 - rtf)));
          if (ready) {
            this._startPlayback();
          }
        } else {
          this._drainQueue();
        }
      }

      _startPlayback() {
        if (this.startedPlaying || !this.isPlaying) return;
        this.startedPlaying = true;
        this.nextStartTime = this.ctx.currentTime + 0.03;
        this._drainQueue();
      }

      _drainQueue() {
        if (!this.startedPlaying || !this.isPlaying || this.queue.length === 0) return;
        const now = this.ctx.currentTime;
        if (this.nextStartTime < now) {
          this.nextStartTime = now + 0.02;
        }

        // Coalesce all queued chunks into a single contiguous AudioBuffer to eliminate node fragmentation
        let totalSamples = 0;
        for (let i = 0; i < this.queue.length; i++) {
          totalSamples += this.queue[i].length;
        }
        if (totalSamples === 0) {
          this.queue = [];
          return;
        }

        const merged = new Float32Array(totalSamples);
        let offset = 0;
        while (this.queue.length > 0) {
          const chunk = this.queue.shift();
          merged.set(chunk, offset);
          offset += chunk.length;
        }

        const buffer = this.ctx.createBuffer(1, merged.length, this.sampleRate);
        buffer.copyToChannel(merged, 0);
        const source = this.ctx.createBufferSource();
        source.buffer = buffer;
        source.connect(this.ctx.destination);
        source.start(this.nextStartTime);
        this.nextStartTime += buffer.duration;
      }

      finish() {
        if (!this.startedPlaying) {
          this._startPlayback();
        } else {
          this._drainQueue();
        }
      }

      stop() {
        console.info('[cera:html] streamer stop called');
        this.isPlaying = false;
        this.queue = [];
        if (this.ctx && this.ctx.state !== 'closed') {
          this.ctx.close().catch(() => {});
        }
      }
    }

    window.ceraStartAudioStream = function(sampleRate) {
      window.ceraStopAudioStream();
      activeStreamer = new CeraAudioStreamer(sampleRate || 24000);
    };

    window.ceraAppendAudioStreamChunk = function(chunk) {
      if (activeStreamer) {
        activeStreamer.appendChunk(chunk);
      }
    };

    window.ceraFinishAudioStream = function() {
      if (activeStreamer) {
        activeStreamer.finish();
      }
    };

    window.ceraStopAudioStream = function() {
      if (activeStreamer) {
        activeStreamer.stop();
        activeStreamer = null;
      }
    };

    window.ceraProbeBundleFiles = async function(bundleName, quant) {
      try {
        const manifestUrl = `https://huggingface.co/LiquidAI/LeapBundles/raw/main/${bundleName}/${quant}.json`;
        const manifestRes = await fetch(manifestUrl);
        if (!manifestRes.ok) return '{}';
        const manifest = await manifestRes.json();
        const loadTime = manifest.load_time_parameters || {};
        const urls = [];
        for (const key of ['model', 'multimodal_projector', 'audio_decoder', 'audio_tokenizer']) {
          const val = loadTime[key];
          if (val && typeof val === 'string' && val.trim().length > 0) {
            const trimmed = val.trim();
            const resolved = trimmed.startsWith('http') ? trimmed : new URL(trimmed, manifestUrl).href;
            urls.push(resolved);
          }
        }
        const sizes = {};
        await Promise.all(
          urls.map(async (url) => {
            try {
              const res = await fetch(url, { method: 'HEAD' });
              const cl = res.headers.get('content-length');
              if (cl) {
                const len = parseInt(cl, 10);
                if (len > 0) {
                  sizes[url] = len;
                  const parts = url.split('/');
                  const fileName = parts[parts.length - 1];
                  sizes[fileName] = len;
                }
              }
            } catch (_) {}
          })
        );
        return JSON.stringify(sizes);
      } catch (err) {
        return '{}';
      }
    };

    window.ceraPlayAudio = async function(raw, sampleRate) {
      window.ceraStopAudio();
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const sr = sampleRate || 24000;
      const ctx = new AudioCtx({ sampleRate: sr });
      if (ctx.state === 'suspended') {
        await ctx.resume().catch(() => {});
      }
      activeAudioCtx = ctx;
      const data = raw instanceof Float32Array ? raw : new Float32Array(raw);
      console.info(
        `[cera:html] ceraPlayAudio called with ${data.length} samples at ${sr}Hz, ctx.state=${ctx.state}`,
      );
      const buffer = ctx.createBuffer(1, data.length, sr);
      buffer.copyToChannel(data, 0);
      const source = ctx.createBufferSource();
      source.buffer = buffer;
      source.connect(ctx.destination);
      activeAudioSource = source;
      return new Promise((resolve) => {
        source.onended = () => {
          console.info('[cera:html] ceraPlayAudio onended fired');
          if (activeAudioSource === source) {
            activeAudioSource = null;
          }
          if (ctx.state !== 'closed') {
            ctx.close().catch(() => {});
          }
          resolve();
        };
        source.start(0);
      });
    };

    window.ceraStopAudio = function() {
      if (activeAudioSource) {
        try { activeAudioSource.stop(); } catch (_) {}
        activeAudioSource = null;
      }
      if (activeAudioCtx) {
        try { if (activeAudioCtx.state !== 'closed') activeAudioCtx.close(); } catch (_) {}
        activeAudioCtx = null;
      }
      if (activeStreamer) {
        activeStreamer.stop();
        activeStreamer = null;
      }
    };

    window.ceraStartAudioStream = function(sampleRate) {
      console.info(`[cera:html] ceraStartAudioStream called (sampleRate=${sampleRate})`);
      if (activeStreamer) activeStreamer.stop();
      activeStreamer = new CeraAudioStreamer(sampleRate || 24000);
    };

    window.ceraAppendAudioStreamChunk = function(raw) {
      if (activeStreamer) {
        activeStreamer.appendChunk(raw);
      } else {
        console.warn('[cera:html] ceraAppendAudioStreamChunk called but no activeStreamer exists!');
      }
    };

    window.ceraDownloadFile = function(bytes, filename, mimeType) {
      try {
        const data = bytes instanceof Uint8List || bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
        const blob = new Blob([data], { type: mimeType || 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename || 'cera_download';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      } catch (err) {
        console.error('[cera:html] ceraDownloadFile failed:', err);
      }
    };

    globalThis.ceraDecodeAudioBlob = window.ceraDecodeAudioBlob;
    globalThis.ceraPlayAudio = window.ceraPlayAudio;
    globalThis.ceraStopAudio = window.ceraStopAudio;
    globalThis.ceraStartAudioStream = window.ceraStartAudioStream;
    globalThis.ceraAppendAudioStreamChunk = window.ceraAppendAudioStreamChunk;
    globalThis.ceraFinishAudioStream = window.ceraFinishAudioStream;
    globalThis.ceraStopAudioStream = window.ceraStopAudioStream;
    globalThis.ceraDownloadFile = window.ceraDownloadFile;
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

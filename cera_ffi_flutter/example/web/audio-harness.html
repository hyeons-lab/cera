<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cera audio harness</title>
  <style>
    body { font: 13px/1.5 ui-monospace, Menlo, monospace; background:#111; color:#ddd; margin:0; padding:16px; }
    button { font: inherit; padding:6px 12px; margin-right:8px; background:#2a2a2a; color:#ddd; border:1px solid #444; border-radius:4px; cursor:pointer; }
    button:disabled { opacity:.4; cursor:default; }
    input[type=text] { font: inherit; width:420px; padding:6px; background:#1c1c1c; color:#ddd; border:1px solid #444; border-radius:4px; }
    #log { white-space:pre-wrap; margin-top:12px; max-height:60vh; overflow:auto; border-top:1px solid #333; padding-top:8px; }
    .err { color:#ff6b6b; } .ok { color:#6bff8f; } .warn { color:#ffd36b; }
    #stats { margin-top:8px; color:#8ab4ff; }
  </style>
</head>
<body>
  <h3>Cera audio harness <span id="quant"></span> <span id="rev" style="color:#8ab4ff"></span></h3>
  <div>
    <input type="text" id="prompt" value="Say hello and introduce yourself in one short sentence.">
    <label><input type="checkbox" id="greedy" checked> greedy</label>
  </div>
  <div style="margin-top:8px">
    <button id="load">1. Load model</button>
    <button id="run" disabled>2. Run TTS</button>
    <button id="play" disabled>Play</button>
    <button id="save" disabled>Save WAV</button>
    <button id="specdiff" disabled>Spectrum diff vs native</button>
  </div>
  <div id="stats"></div>
  <div id="log"></div>

<script type="module">
const LOCAL_DIR = '/models-local';
const BUNDLE_ID = 'LFM2.5-Audio-1.5B-GGUF';
// `?quant=Q8_0` picks the bundle; both live side by side under LOCAL_DIR and
// their filenames already carry the quant, so the basename mapping separates
// them without any per-quant directory.
const QUANT = new URLSearchParams(location.search).get('quant') || 'Q8_0';

const logEl = document.getElementById('log');
const statsEl = document.getElementById('stats');
function log(msg, cls) {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
  console.info('[harness] ' + msg);
}

// Redirect every huggingface.co request at the locally served copy, so the
// harness never downloads a gigabyte to reproduce an audio bug. The bundle
// loader asks for `<quant>.json` next to the model files; on disk that
// manifest is named after the bundle, so that one name is remapped and every
// other file keeps its basename.
function toLocal(url) {
  if (!url.startsWith('https://huggingface.co/')) return url;
  const base = url.split('?')[0].split('/').pop();
  const name = base === `${QUANT}.json` ? `LFM2.5-Audio-1.5B-${QUANT}.json` : base;
  // A quant with no local manifest falls through to the engine's built-in
  // one, which is what names the four files below.
  return `${LOCAL_DIR}/${name}`;
}
const origFetch = globalThis.fetch.bind(globalThis);
globalThis.fetch = (input, init) => {
  const url = typeof input === 'string' ? input : (input instanceof Request ? input.url : String(input));
  const mapped = toLocal(url);
  if (mapped !== url) {
    // A Request carries the original URL in an immutable field, so a remapped
    // one has to be rebuilt rather than patched.
    if (input instanceof Request) return origFetch(new Request(mapped, input), init);
    return origFetch(mapped, init);
  }
  return origFetch(input, init);
};

let wasm, session, sampleRate = 24000;
const frames = [];   // per-frame rms, for spotting silence/noise
let pcm = [];        // every sample, concatenated

document.getElementById('load').onclick = async () => {
  const btn = document.getElementById('load');
  btn.disabled = true;
  try {
    if (!navigator.gpu) { log('navigator.gpu missing - WebGPU unavailable', 'err'); btn.disabled = false; return; }
    log('importing cera_wasm.js ...');
    wasm = await import('./cera/cera_wasm.js');
    await wasm.default();
    document.getElementById('rev').textContent = 'v' + (wasm.version ? wasm.version() : '?');
    log('wasm ready, loading bundle from ' + LOCAL_DIR + ' ...');
    const repo = new wasm.BundleRepo();
    const t0 = performance.now();
    session = await wasm.WebGpuSession.fromBundleId(
      repo, BUNDLE_ID, QUANT, 4096, null,
      (url, done, total) => {
        if (total) log(`  ${url.split('/').pop()}  ${(100 * done / total).toFixed(0)}%`);
      },
    );
    log(`bundle loaded in ${((performance.now() - t0) / 1000).toFixed(1)}s`, 'ok');
    log(`audioOut=${session.audioOut}  audioIn=${session.audioIn}`);
    document.getElementById('run').disabled = false;
    document.getElementById('specdiff').disabled = false;
  } catch (e) {
    log('load failed: ' + (e && e.stack || e), 'err');
    btn.disabled = false;
  }
};

document.getElementById('run').onclick = async () => {
  const btn = document.getElementById('run');
  btn.disabled = true;
  frames.length = 0; pcm = [];
  statsEl.textContent = '';
  try {
    const tk = session.tokenizer;
    const promptText = document.getElementById('prompt').value;
    const messages = [
      { role: 'system', content: 'Respond with interleaved text and audio.' },
      { role: 'user', content: promptText },
    ];
    let formatted;
    try { formatted = tk.applyChatTemplate(messages, true); }
    catch (_) { formatted = promptText; }
    const ids = Array.from(tk.encodeSpecial(formatted, false));
    log(`prompt tokens=${ids.length}`);

    let text = '';
    const onToken = (piece) => { text += piece; };
    const onAudio = (buf, rate) => {
      const data = buf instanceof Float32Array ? buf : new Float32Array(buf);
      sampleRate = rate || sampleRate;
      let sumSq = 0, peak = 0;
      for (let i = 0; i < data.length; i++) {
        const v = data[i];
        sumSq += v * v;
        const a = v < 0 ? -v : v;
        if (a > peak) peak = a;
      }
      const rms = Math.sqrt(sumSq / Math.max(1, data.length));
      frames.push({ n: data.length, rms, peak });
      for (let i = 0; i < data.length; i++) pcm.push(data[i]);
    };

    const greedy = document.getElementById('greedy').checked;
    const t0 = performance.now();
    await session.generateTokens(
      ids, 512,
      greedy ? 0.0 : 0.7, null, greedy ? 1 : 40, null,
      onToken, onAudio,
    );
    const secs = (performance.now() - t0) / 1000;

    log(`text: ${JSON.stringify(text)}`);
    if (frames.length === 0) {
      log('NO AUDIO FRAMES were emitted', 'err');
    } else {
      const rmsAll = frames.map(f => f.rms);
      const silent = rmsAll.filter(r => r < 1e-4).length;
      const dur = pcm.length / sampleRate;
      const overall = Math.sqrt(pcm.reduce((s, v) => s + v * v, 0) / Math.max(1, pcm.length));
      const clipped = pcm.filter(v => v > 1 || v < -1).length;
      statsEl.textContent =
        `frames=${frames.length}  samples=${pcm.length}  dur=${dur.toFixed(2)}s  rate=${sampleRate}  ` +
        `rms=${overall.toFixed(4)}  peak=${Math.max(...frames.map(f => f.peak)).toFixed(4)}  ` +
        `silentFrames=${silent}  clipped=${clipped}  gen=${secs.toFixed(1)}s`;
      log(`first 12 frame rms: ${rmsAll.slice(0, 12).map(r => r.toFixed(4)).join(' ')}`);
      log(statsEl.textContent, silent === frames.length ? 'err' : 'ok');
      document.getElementById('play').disabled = false;
      document.getElementById('save').disabled = false;
    }
  } catch (e) {
    log('generate failed: ' + (e && e.stack || e), 'err');
  }
  btn.disabled = false;
};

document.getElementById('play').onclick = async () => {
  const ctx = new AudioContext({ sampleRate });
  const buf = ctx.createBuffer(1, pcm.length, sampleRate);
  buf.copyToChannel(Float32Array.from(pcm), 0);
  const src = ctx.createBufferSource();
  src.buffer = buf; src.connect(ctx.destination); src.start();
  log(`playing ${(pcm.length / sampleRate).toFixed(2)}s`);
};

function wav(samples, rate) {
  const b = new ArrayBuffer(44 + samples.length * 2);
  const v = new DataView(b);
  const s = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
  s(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); s(8, 'WAVEfmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  s(36, 'data'); v.setUint32(40, samples.length * 2, true);
  for (let i = 0; i < samples.length; i++) {
    const c = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(44 + i * 2, c < 0 ? c * 0x8000 : c * 0x7fff, true);
  }
  return new Blob([b], { type: 'audio/wav' });
}

// Diff this build's detokenizer against the native reference emitted by
// `cera/tests/detok_wasm_reference.rs`. Same codes, same weights, same state
// trajectory, so anything that shows up here is the detokenizer itself.
document.getElementById('specdiff').onclick = async () => {
  const btn = document.getElementById('specdiff');
  btn.disabled = true;
  try {
    const meta = await (await fetch('/ref/native_spectrum.bin.json')).json();
    const buf = await (await fetch('/ref/native_spectrum.bin')).arrayBuffer();
    const native = new Float32Array(buf);
    log(`native reference: ${native.length} floats, ${meta.sub_frames} sub-frames, ${meta.bins} bins`);

    const mine = session.debugDetokenizeSpectrum(Int32Array.from(meta.codes));
    log(`this build:       ${mine.length} floats`);
    if (mine.length !== native.length) {
      log(`LENGTH MISMATCH - cannot diff`, 'err');
      btn.disabled = false;
      return;
    }

    // Report magnitude and phase apart: only the first half of a frame feeds
    // exp(), so a big phase difference and a big magnitude difference are not
    // the same finding.
    const bins = meta.bins, fs = meta.frame_size;
    let maxMag = 0, maxMagAt = -1, maxAng = 0, maxAngAt = -1, nonFinite = 0;
    const perFrame = [];
    for (let f = 0; f < meta.sub_frames; f++) {
      let fm = 0, fa = 0;
      for (let j = 0; j < bins; j++) {
        const i = f * fs + j;
        if (!Number.isFinite(mine[i])) nonFinite++;
        const d = Math.abs(mine[i] - native[i]);
        if (d > fm) fm = d;
        const k = f * fs + bins + j;
        const da = Math.abs(mine[k] - native[k]);
        if (da > fa) fa = da;
      }
      perFrame.push([fm, fa]);
      if (fm > maxMag) { maxMag = fm; maxMagAt = f; }
      if (fa > maxAng) { maxAng = fa; maxAngAt = f; }
    }
    const worst = perFrame
      .map(([m, a], f) => ({ f, m, a }))
      .sort((x, y) => y.m - x.m)
      .slice(0, 8);
    log(`max |d(log_abs)| = ${maxMag.toExponential(3)} at sub_frame ${maxMagAt}`,
        maxMag > 1e-2 ? 'err' : 'ok');
    log(`max |d(angle)|   = ${maxAng.toExponential(3)} at sub_frame ${maxAngAt}`,
        maxAng > 1e-2 ? 'err' : 'ok');
    log(`non-finite in this build: ${nonFinite}`, nonFinite ? 'err' : 'ok');
    log('worst 8 sub-frames by |d(log_abs)|:');
    for (const w of worst) {
      log(`  sub_frame ${String(w.f).padStart(3)}: d_mag=${w.m.toExponential(3)}  d_ang=${w.a.toExponential(3)}`);
    }
    // First divergence tells us whether it starts clean and drifts, or is
    // wrong from the very first frame.
    const firstBad = perFrame.findIndex(([m, a]) => m > 1e-3 || a > 1e-3);
    log(`first sub_frame diverging by >1e-3: ${firstBad === -1 ? 'none' : firstBad}`);
    globalThis.specdiff = { native, mine, meta, perFrame };
  } catch (e) {
    log('spectrum diff failed: ' + (e && e.stack || e), 'err');
  }
  btn.disabled = false;
};

document.getElementById('save').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(wav(pcm, sampleRate));
  a.download = 'cera-tts.wav';
  a.click();
};

// Expose for driving from the console / automation.
globalThis.harness = {
  frames, get pcm() { return pcm; }, get sampleRate() { return sampleRate; },
  get session() { return session; },
};
document.getElementById('quant').textContent = '[' + QUANT + ']';
log('ready - click "Load model"  (quant=' + QUANT + ', add ?quant=Q4_0 to switch)');
</script>
</body>
</html>

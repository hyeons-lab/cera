# Resolve `cera_ffi` from the working tree, matching the path dependency the app
# already declares on `cera_ffi_flutter`.
#
# Without this, the plugin's hosted pin (`cera_ffi: 0.4.0`) would send pub to
# pub.dev for the Dart half while the native half comes from `../`, so the app
# would build against a released API and a working-tree library. Overrides are
# not transitive: an override in the plugin's own pubspec_overrides.yaml applies
# only to builds rooted there, not to this app.
#
# This app is `publish_to: none`, so unlike the plugin's copy this file needs no
# .pubignore entry.
dependency_overrides:
  cera_ffi:
    path: ../../cera_ffi

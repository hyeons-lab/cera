include: package:lints/recommended.yaml

analyzer:
  exclude:
    # Exclude build outputs and platform scaffold directories so that transient
    # or generated files are ignored by 'dart analyze' under Flutter 3.47 conventions.
    # Note that generated UniFFI bindings reside in `cera_ffi` rather than here.
    - build/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**

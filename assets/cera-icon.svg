<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --cera-gold: #FBBF24;
      --cera-tangerine: #FB923C;
      --cera-terracotta: #EA580C;
      --cera-rust: #9A3412;
    }
  </style>

  <g id="cera-helix-mark">
    <!-- Strand 1: Upper-Left Continuous Gold Loop (Closed on Left, Arches Over Top) -->
    <path id="strand-gold" d="
      M 100 256 
      C 100 155 170 75 270 75 
      C 325 75 365 98 385 125 
      C 395 138 388 155 370 160 
      C 352 165 338 152 325 138 
      C 290 102 230 95 190 135 
      C 152 172 152 230 185 268 
      L 255 345 
      C 265 355 252 370 238 360 
      L 155 275 
      C 120 238 100 215 100 256 Z" fill="#FBBF24" />

    <!-- Strand 2: Top-Right Tangerine Wing (Smooth Return Loop) -->
    <path id="strand-tangerine" d="
      M 385 125 
      C 418 165 425 225 385 270 
      C 370 286 348 280 342 260 
      C 336 240 348 225 362 208 
      C 385 180 380 145 356 122 
      L 385 125 Z" fill="#FB923C" />

    <!-- Strand 3: Lower Continuous Terracotta Loop (Exact Vertical Mirror across y=256, Closed on Left) -->
    <!-- Mirror formula: y' = 512 - y -->
    <path id="strand-terracotta" d="
      M 100 256 
      C 100 357 170 437 270 437 
      C 325 437 365 414 385 387 
      C 395 374 388 357 370 352 
      C 352 347 338 360 325 374 
      C 290 410 230 417 190 377 
      C 152 340 152 282 185 244 
      L 255 167 
      C 265 157 252 142 238 152 
      L 155 237 
      C 120 274 100 297 100 256 Z" fill="#EA580C" />

    <!-- Strand 4: Lower-Right Rust Fold (Exact Vertical Mirror across y=256) -->
    <!-- Mirror formula: y' = 512 - y -->
    <path id="strand-rust" d="
      M 385 387 
      C 418 347 425 287 385 242 
      C 370 226 348 232 342 252 
      C 336 272 348 287 362 304 
      C 385 332 380 367 356 390 
      L 385 387 Z" fill="#9A3412" />
  </g>
</svg>

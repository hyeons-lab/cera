[versions]
# Latest stable as of 2026-09 (Gradle 9.8.0 in the wrapper).
kotlin = "2.4.0"
agp = "9.4.1"
mavenPublish = "0.36.0"
compileSdk = "36"
minSdk = "28"
# JNA + coroutines are what the UniFFI-generated `cera_ffi.kt` compiles against
# (matches the cera-parity Kotlin leg).
jna = "5.19.1"
kotlinxCoroutines = "1.10.2"
androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"

[libraries]
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
# Plain JVM unit tests only (mergeAdspPaths); no Robolectric, no device.
junit = "junit:junit:4.13.2"
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }

[plugins]
# AGP 9+ has built-in Kotlin, so the android module needs no kotlin-android plugin.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }

[package]
name = "cera-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "wasm-bindgen browser/Node bindings for the cera inference engine"
# wasm-pack + cargo both read this when building / packaging.
# The LICENSE-* entries are symlinks to the workspace-root copies
# so we don't duplicate the text on disk; cargo, npm, and git all
# follow them transparently. README.md is listed explicitly so
# crates.io picks it up if/when this crate is published there;
# wasm-pack also copies it into `pkg/README.md` for the npm side.
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

[lib]
# `cdylib` produces the `.wasm` artifact that wasm-bindgen-cli post-
# processes into JS glue. `rlib` is kept so this crate can also be
# linked into native test binaries (none today, but cheap to leave on
# and future-proofs against `wasm-bindgen-test --node` runners that
# need both shapes).
crate-type = ["cdylib", "rlib"]

[dependencies]
# cera is consumed with default features off — none of the current
# exports need mmap / parallel / std-fs / disk-cache. Future engine /
# session wrappers (Phase 3.x) will turn on the features they need
# rather than dragging the desktop default-set into wasm builds.
#
# The opt-in `parallel` feature on this crate flips
# `cera/parallel` on for threaded wasm builds — see the [features]
# table below.
cera = { path = "../cera", version = "0.5.4", default-features = false }
bytemuck.workspace = true
wasm-bindgen.workspace = true
# Tool calling: parse tool schemas (JSON strings from JS) and serialize parsed
# tool calls back to JSON strings across the wasm boundary.
serde_json.workspace = true
# Used only by the JsError mapping helper to format cera's anyhow-typed
# errors with `{:#}` (full chain). No native heuristics or backtraces;
# wasm builds get the same compact `e: cause: …` output JS callers
# can render.
anyhow.workspace = true
# `js_sys::Function` (token-streaming callback arg type) and
# `js_sys::Uint32Array` (copying token batches into JS-owned memory
# for the `on_text_tokens` trampoline). Already a transitive dep of
# wasm-bindgen; declared here because we use the public types.
js-sys = "0.3"
# The GPU vision encoder degrades to the CPU one on a runtime GPU failure.
# `cera` logs that same fallback through `tracing` on its own image path, so
# matching it keeps one story rather than inventing a second logging channel
# here. Inert without a subscriber; browser callers who want the messages
# install `tracing-wasm` (or equivalent) themselves.
tracing = { workspace = true }
# Bridges Rust `Future`s to JS Promises — required for the `async`
# `#[wasm_bindgen]` exports on the WebGPU session (`WebGpuSession`).
# wasm-bindgen's async-fn codegen references `wasm_bindgen_futures`
# directly, so it must be a declared dependency.
wasm-bindgen-futures = { workspace = true }
# SHA-256 for the browser bundle store's integrity checks. Pure Rust and
# incremental, so a download is hashed as it streams and a cached file is
# re-verified in chunks. `crypto.subtle.digest` was the alternative and
# can't do either: it's one-shot over a whole buffer, which would mean
# holding a second copy of a multi-GB model to check it.
sha2 = { workspace = true }
# Browser APIs for the bundle store: OPFS (the `FileSystem*` handles),
# `fetch` responses and their streaming bodies. Feature-gated per
# interface, so this list is exactly what `src/bundle.rs` touches: any
# addition there needs a matching entry here or the build fails with a
# missing type rather than silently widening the surface.
web-sys = { version = "0.3", features = [
    # `AbortSignal` also unlocks `RequestInit::set_signal`, which is what
    # puts a deadline on the bundle store's fetches. Without one a stalled
    # connection leaves the promise pending forever instead of rejecting.
    "AbortSignal",
    "Blob",
    "console",
    "File",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemHandle",
    "FileSystemHandleKind",
    "FileSystemReadWriteOptions",
    "FileSystemRemoveOptions",
    "FileSystemSyncAccessHandle",
    "FileSystemWritableFileStream",
    "Headers",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "RequestInit",
    "Response",
    "StorageManager",
    "WritableStream",
] }

# `wasm-bindgen-rayon` is wasm-only — it pulls in `web_sys::Worker`
# / Node `worker_threads` glue that doesn't exist on native targets.
# Scoping under `cfg(target_arch = "wasm32")` keeps `cargo check
# --workspace` happy on the host even with `--features parallel`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-rayon = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true }

# `wasm-bindgen-test` drives the headless-Chrome WebGPU smoke test
# (`tests/webgpu_smoke.rs`) via `wasm-pack test --headless --chrome
# --features wgpu`. wasm-only — the runner injects a browser harness.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[features]
# Image input is on by default because a VL bundle that loads but cannot
# accept an image is a worse failure than a slightly larger download: the
# engine reports `capabilities.imageIn = false` and `appendImage` throws,
# which reads as a broken model rather than a missing build flag.
default = ["vl"]

# `vl`: image input. Turns on `cera/vl-preprocess` (PNG/JPEG decode +
# resize + normalize via the pure-Rust `image` crate, no system libpng or
# libjpeg). Without it `Session.appendImage` compiles but always returns
# `UnsupportedModality`. Text-only or raw-PCM-audio-only deployments can
# `--no-default-features` to drop the decoders from the `.wasm`.
vl = ["cera/vl-preprocess"]

# `parallel` — opt-in multi-threaded wasm build. Lights up
# `cera/parallel` (rayon) and links `wasm-bindgen-rayon`, which
# emits a `#[wasm_bindgen]` `initThreadPool(numThreads)` export
# that JS callers `await` once before driving inference.
#
# Only useful with the matching build flags: atomics target-feature
# + `-Z build-std=panic_abort,std`. The `wasm-web-mt` / `wasm-node-mt`
# justfile recipes wire those in. Plain `wasm-pack build --features
# parallel` without those flags will fail to link — that's intended,
# the recipes are the supported entry point.
#
# Browsers also need cross-origin isolation (COOP `same-origin` +
# COEP `require-corp` headers on the host page) for
# `SharedArrayBuffer` to be available. Node has no equivalent gate.
parallel = ["cera/parallel", "dep:wasm-bindgen-rayon"]

# `wgpu` — opt-in WebGPU compute backend. Turns on `cera/gpu`, which
# pulls in the wgpu compute pipelines so Q4_0 LFM2 prefill + decode
# can run on the GPU. Track B PR 4.1 (wasm wiring; not Track A —
# Track A is the kernel-parity work that already shipped in
# #151/#154/#156/#157): this PR only wires the cargo feature so the
# build succeeds with `gpu` enabled on wasm32; no wgpu init /
# dispatch surface is exposed through cera-wasm yet. The async init
# + sync-forward shim that lets JS callers run inference on the GPU
# is Track B PR 4.2.
#
# Note: cannot be combined with `parallel` today. The
# `fragile-send-sync-non-atomic-wasm` feature on wgpu only lights up
# its Send+Sync impls when the `atomics` target-feature is OFF; the
# threaded build sets `atomics` (via `wasm-web-mt` / `wasm-node-mt`)
# and wgpu types stop being Sync, breaking the `Model: Send + Sync`
# bound. A multi-threaded wgpu wasm build would need to run wgpu on
# a dedicated worker (atomics-free per-worker) or wait for upstream
# wgpu to ship atomics-safe Send+Sync — both are post-PR-4.2 work.
wgpu = ["cera/gpu"]

[package.metadata.docs.rs]
# docs.rs runs on linux x86_64 by default, which would skip the
# `cfg(target_arch = "wasm32")` lib-level guard and produce empty
# docs. Pin docs.rs to wasm32 so the wrapper surface actually
# renders.
targets = ["wasm32-unknown-unknown"]

# wasm-pack profile config (consumed by `wasm-pack build --release`).
#
# `-O3` over `-Oz`: this is an inference engine, hot-loop perf matters
# more than minimum download size, and `-Oz` can cost ~5% on tight
# numerical loops. `-O3` still cuts the binary ~50% from the LTO-only
# baseline.
#
# Feature flags enable wasm proposals that modern wasm-bindgen +
# rustc emit by default:
#   - `--enable-sign-ext`           — i32/i64 sign-extension ops
#   - `--enable-bulk-memory`        — `memory.copy` / `memory.fill`
#   - `--enable-mutable-globals`    — required by `getrandom/js`
#   - `--enable-nontrapping-float-to-int` — saturating float→int
#   - `--enable-reference-types`    — `externref` (used by JS interop)
#   - `--enable-threads`            — atomics + shared-memory ops
#                                     emitted by the threaded build
#                                     (`--features parallel`). No-op
#                                     on single-threaded builds (no
#                                     atomic ops in the wasm body),
#                                     so always-on is safe.
#   - `--enable-simd`               — the `v128` ops emitted by the
#                                     `wasm_simd` kernels in
#                                     `cera/src/backend/simd.rs`.
#                                     `.cargo/config.toml` turns
#                                     `+simd128` on for this target, and
#                                     without this flag wasm-opt rejects
#                                     the result with the unhelpful
#                                     "Fatal: error validating input".
# All seven are universally supported in browsers + Node since
# late-2020 builds; without them, wasm-opt refuses the wasm-bindgen
# input as "non-MVP". Pin them here so local + CI builds stay in
# sync.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    '-O3',
    '--enable-sign-ext',
    '--enable-bulk-memory',
    '--enable-mutable-globals',
    '--enable-nontrapping-float-to-int',
    '--enable-reference-types',
    '--enable-threads',
    '--enable-simd',
]

# `target-cpu=native` only makes sense when the build host matches the target.
# Cross-compiling from Apple Silicon (e.g. `cargo check --target x86_64-unknown-linux-gnu`)
# resolves "native" to `apple-m1`, which rustc then rejects for non-aarch64 targets.
# macOS dev targets keep `native` (Mac is the primary dev platform). Linux targets
# use a concrete baseline that works for both native Linux builds and cross-compiles;
# per-function `#[target_feature(...)]` attributes still gate the NEON / AVX2 hot-path
# kernels, so losing `native` on Linux only affects non-hot-path autovectorization.
# Linux users who want host-specific tuning can set `RUSTFLAGS="-C target-cpu=native"`
# themselves at build time.

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]

[target.x86_64-unknown-linux-gnu]
# `x86-64-v3` ≈ Haswell baseline: AVX2 + FMA + BMI1/BMI2. Matches what cera's
# AVX2 kernels already opt into via `#[target_feature(enable = "avx2,fma")]`.
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.aarch64-unknown-linux-gnu]
# No extra flags — generic aarch64 baseline. The NEON / dotprod hot-path kernels
# are opted in per-function via `#[target_feature(enable = "neon,dotprod")]`.

# Android: force 16KB ELF alignment. Devices with 16KB pages (Android 15+)
# refuse to load native libraries whose LOAD segments are 4KB-aligned, and
# Google Play requires 16KB-clean binaries. CI and the release pipeline pin
# NDK r28c, whose default is already 16KB; the explicit flags below (Google's
# documented recipe for r27 and older) stay so the requirement holds even if
# the pin ever moves to an NDK with a 4KB default:
# https://developer.android.com/guide/practices/page-sizes
# Verified to reach the link under cargo-ndk (a 4096 probe visibly changed
# the output alignment); `scripts/assert-16k-pages.py` enforces the result
# in CI and in `just android-libs`. Larger alignment stays backward
# compatible: 16KB-aligned segments load fine on 4KB-page devices.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "link-arg=-Wl,-z,common-page-size=16384"]

[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "link-arg=-Wl,-z,common-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "link-arg=-Wl,-z,common-page-size=16384"]

[target.i686-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "link-arg=-Wl,-z,common-page-size=16384"]

[target.wasm32-unknown-unknown]
# `simd128` is wasm's only SIMD feature and every browser and Node release since
# 2021 has it, so there is no tier to runtime-dispatch between and no reason to
# ship without it. What the flag gates is the DISPATCH: the `wasm_simd` kernels
# in `backend/simd.rs` carry their own `#[target_feature(enable = "simd128")]`
# and compile either way, but the `vec_dot_*` arms that call them are
# `#[cfg(target_feature = "simd128")]`. Without this flag every caller falls
# through to the scalar reference, the kernels are stripped as unreachable, and
# the artifact has no vector code in it. That scalar path measured 0.68 tok/s
# against 160 native on an LFM2.5-350M-Q4_0.
#
# Note this flag alone buys ~5%: LLVM does not autovectorize the nibble
# unpacking these formats need. It matters because it switches on the
# hand-written kernels.
#
# `RUSTFLAGS` in the environment REPLACES this rather than appending, so any
# recipe that sets it (see `WASM_MT_RUSTFLAGS` in the justfile) has to repeat
# `+simd128` or it silently builds the scalar path.
rustflags = ["-C", "target-feature=+simd128"]

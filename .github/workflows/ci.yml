name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Override .cargo/config.toml target-cpu=native — CI runners vary
  RUSTFLAGS: ""
  # NOTE: that empty value REPLACES `.cargo/config.toml` for every target
  # rather than appending to it, which also deletes the wasm32 entry's
  # `+simd128`. Every wasm job below puts it back: at job level where it can,
  # so a step added later inherits it rather than silently building scalar,
  # and inside its own flag list in `cera-wasm-pack-mt`, which sets RUSTFLAGS
  # in the step and so cannot inherit anything.

jobs:
  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Version drift check
        run: ./scripts/bump-version.sh --check
      - name: Check formatting
        run: cargo fmt --check
      - name: Check build-script helper formatting
        # rustfmt does not descend into `include!`d files, so `cargo fmt` never
        # sees the build-script helpers under `cera/build_support/`. Mirrors the
        # `rustfmt` line of `just fmt`.
        run: rustfmt --edition 2024 --check cera/build_support/*.rs
      - name: Clippy
        # `--all-targets` lints tests, benches, and examples too — without it
        # clippy skips those compile targets, so lints living in test modules
        # (e.g. `needless_update`, `items_after_test_module`) slip through CI.
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Rustdoc lint. Runs on macOS so `--all-features` can enable the macOS-only
  # `metal` backend (a Linux runner can't compile it), giving the doc build
  # coverage of the metal-gated modules too. `--lib` documents the library
  # targets only, dodging the known bin/lib `cera` output-filename collision
  # (rust-lang/cargo#6313). `-D warnings` turns broken/private intra-doc links
  # into failures.
  docs:
    name: Doc lint (rustdoc)
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
      - uses: Swatinem/rust-cache@v2
      - name: Rustdoc (deny warnings, all features incl. metal)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --all-features --no-deps --lib

  test:
    name: Test (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
      - uses: Swatinem/rust-cache@v2
      # `--no-fail-fast`: without it cargo stops after the first test binary
      # that fails, so a single flaky unit test silently skips every remaining
      # binary and the log shows a partial count that looks like a full run.
      # Chasing an intermittent failure is hard enough with its name; it is
      # near-impossible when the run that caught it also hid what else broke.
      - name: Run tests
        env:
          # Turn a silent skip into a failure for the x86 int8 kernels, the same
          # way the `simd-i8mm` leg below does for aarch64. Every GitHub-hosted
          # x86 runner has AVX2, and the AVX2 int8 GEMM/GEMV is now the default
          # x86 production path, so a skip here means feature detection broke —
          # not that the host is incapable. Scoped to the x86 leg because that
          # is where the requirement means something: on `macos-latest` (arm64)
          # the `avx2_int8` module is cfg'd out entirely, so nothing would ever
          # consult the variable and setting it would assert nothing.
          CERA_REQUIRE_SIMD: ${{ matrix.os == 'ubuntu-latest' && 'avx2' || '' }}
        run: cargo test --workspace --no-fail-fast

  # x86_64 with the default-on `avx512` crate feature OFF.
  #
  # With the feature off, x86 caps at the `Avx2` tier and the AVX2 int8 kernels
  # become the whole int8 path — the configuration that runs on any x86 host
  # without AVX-512 silicon. (The feature also gates the `_mm512_*` intrinsics,
  # which need Rust 1.89 — below the crate's current 1.94 MSRV — so the old
  # "still builds on 1.85-1.88" rationale no longer applies; the
  # hardware-coverage reason does.)
  # Nothing else in CI covers this combination — the `--no-default-features`
  # matrix above targets wasm32 only — and it has broken before: a `#[cfg(feature
  # = "avx512")]` on a helper the AVX2 tests call took the config down while every
  # other leg stayed green.
  #
  # Tests, not just `check`: the point is that the AVX2 kernels are exercised
  # without their VNNI comparison target, which is a compile-time *and* runtime
  # property. `CERA_REQUIRE_SIMD=avx2` keeps them from reporting green by
  # skipping.
  x86-no-avx512:
    name: x86_64 without the avx512 feature
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
      - uses: Swatinem/rust-cache@v2
      # No "print the resolved tier" step here, unlike the other SIMD legs.
      # `cera-cli` has no passthrough for cera's `avx512` feature, so
      # `cera-cli -- cpu` would build cera with defaults and print the
      # avx512-enabled tier — a diagnostic for a configuration this job is
      # specifically not testing. `CERA_REQUIRE_SIMD=avx2` below is the real
      # assertion that the intended tier was reached.
      - name: Test without avx512
        env:
          CERA_REQUIRE_SIMD: avx2
        run: >
          cargo test -p cera --no-default-features
          --features parallel,mmap,std-fs,disk-cache,vl-preprocess
          --no-fail-fast

  # Validate the aarch64 i8mm Q8_0 GEMM kernel on real ARMv8.6 hardware.
  # GitHub's `ubuntu-24.04-arm` runner is Azure Cobalt 100 (Arm Neoverse N2,
  # Armv9 → FEAT_I8MM), so this is where the otherwise-unverifiable i8mm tier
  # actually executes. `CERA_REQUIRE_SIMD=i8mm` turns a missing feature into a
  # test failure, so a green check proves the kernel ran rather than silently
  # skipping (which is how the same test behaves on the M1/x86 runners above).
  simd-i8mm:
    name: SIMD i8mm validation (arm64)
    needs: check
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
      - uses: Swatinem/rust-cache@v2
      - name: Print resolved CPU tier
        run: cargo run -q -p cera-cli -- cpu
      # `decode_prefill_identity` is in the filter because this is the only leg
      # that runs on i8mm hardware, and that tier is the one where the decode
      # GEMV and the prefill GEMM at n=1 do not trivially coincide: the i8mm
      # kernels compute `n_even = n & !1`, so at n=1 every cell comes from their
      # scalar remainder helper. The test's claim that Q4_1/Q4KM/Q6K still hold
      # there rests on those helpers mirroring the dotprod GEMM, which no other
      # job can check. The default `test` matrix is x86 plus an M1 runner
      # (dotprod, no i8mm), so without this the branch never executes.
      - name: Validate i8mm + NEON fallbacks (fail if i8mm absent)
        env:
          CERA_REQUIRE_SIMD: i8mm
        run: cargo test -p cera --lib -- cpu_features fallback_tests decode_prefill_identity

  # Run the wgpu compute kernels on CPU via Mesa's lavapipe (software Vulkan).
  # The `gpu` feature is non-default, so the regular `test` job never compiles
  # these — this is the only place the WGSL kernels (the KV-shift oracle, etc.)
  # and the `backend::wgpu` host-side unit tests actually execute. `CERA_REQUIRE_GPU`
  # turns a missing adapter into a failure (mirrors `CERA_REQUIRE_SIMD`), so a
  # green check proves the kernels ran rather than silently skipping.
  gpu-tests:
    name: GPU tests (lavapipe)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CERA_REQUIRE_GPU: 1
      # lavapipe is a Vulkan backend, which accepts SPIR-V passthrough, so the
      # Q4_0/Q8_0 passthrough parity assertions must actually run here (not skip
      # as they do on the Metal leg). Turns a skip into a failure.
      CERA_REQUIRE_PASSTHROUGH: 1
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
      - uses: Swatinem/rust-cache@v2
      # slangc is the source of truth for the passthrough kernels; the committed
      # .spv is only a fallback for build hosts without it. This host is one of
      # those (build.rs uses the committed .spv, and the parity test below runs
      # exactly that shipped artifact on Vulkan), so recompile the .slang with a
      # pinned slangc and confirm the committed .spv is not stale. slangc is
      # fetched to a temp dir and called by absolute path, deliberately NOT on
      # PATH or in $SLANGC, so it does not change what build.rs compiles.
      - name: Verify committed SPIR-V matches the Slang sources
        run: |
          SLANG_VER=2026.13.1
          asset="slang-${SLANG_VER}-linux-x86_64.tar.gz"
          url="https://github.com/shader-slang/slang/releases/download/v${SLANG_VER}/${asset}"
          curl -fsSL -o "$RUNNER_TEMP/slang.tar.gz" "$url"
          mkdir -p "$RUNNER_TEMP/slang"
          tar -xzf "$RUNNER_TEMP/slang.tar.gz" -C "$RUNNER_TEMP/slang"
          slangc=$(find "$RUNNER_TEMP/slang" -type f -name slangc | head -1)
          "$slangc" -v || true
          dir=cera/src/backend/shaders/spirv
          rc=0
          for f in "$dir"/*.slang; do
            name=$(basename "$f" .slang)
            "$slangc" "$f" -target spirv -O3 -entry main -stage compute \
              -o "$RUNNER_TEMP/$name.spv"
            if cmp -s "$RUNNER_TEMP/$name.spv" "$dir/$name.spv"; then
              echo "ok: $name.spv matches slangc $SLANG_VER"
            else
              echo "::error file=$dir/$name.spv::committed $name.spv differs from slangc ${SLANG_VER} output; regenerate with slangc ${SLANG_VER} ('just slang') and commit it. SPIR-V is only byte-reproducible within one slangc version."
              rc=1
            fi
          done
          # Multi-target kernels: same staleness risk, and worse consequences.
          # The MSL half is never compiled on this runner, so a stale
          # `<name>.metal` would only surface on the Metal leg (or a user's
          # device) with no indication that the committed file, not the .slang,
          # was at fault. Entry points are the kernel's own function names, not
          # `main`: default to the basename, or read a `// slang-entries: a b c`
          # header (same parse as build.rs and `just slang`) for kernels whose
          # entry name differs (gelu) or that expose several (elementwise).
          dir=cera/src/backend/shaders/slang
          for f in "$dir"/*.slang; do
            name=$(basename "$f" .slang)
            entries=$(sed -n 's|^[[:space:]]*//[[:space:]]*slang-entries:[[:space:]]*||p' "$f")
            [ -z "$entries" ] && entries="$name"
            entry_args=()
            for e in $entries; do entry_args+=(-entry "$e"); done
            for target in wgsl metal; do
              "$slangc" "$f" -target "$target" -O3 "${entry_args[@]}" -stage compute \
                -o "$RUNNER_TEMP/$name.$target"
              if cmp -s "$RUNNER_TEMP/$name.$target" "$dir/$name.$target"; then
                echo "ok: $name.$target matches slangc $SLANG_VER"
              else
                echo "::error file=$dir/$name.$target::committed $name.$target differs from slangc ${SLANG_VER} output; regenerate with slangc ${SLANG_VER} ('just slang') and commit it."
                rc=1
              fi
            done
          done
          exit $rc
      - name: Install Mesa lavapipe (software Vulkan)
        run: |
          # packages.microsoft.com apt sources ship preinstalled on the GitHub
          # ubuntu image and intermittently serve an invalid InRelease
          # ("NOSPLIT"), which fails `apt-get update` even though we only need
          # Ubuntu-mirror packages. Remove every apt source referencing that
          # host, matched by content so it catches both the legacy .list and the
          # deb822 .sources files (azure-cli uses .sources) regardless of name.
          while IFS= read -r f; do
            sudo rm -f -- "$f"
          done < <(grep -Frl packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null || true)
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
      - name: Show Vulkan adapter
        run: vulkaninfo --summary || true
      - name: Run wgpu kernel + host-logic tests
        run: cargo test -p cera --features gpu --lib --test wgpu_kv_shift_oracle --test wgpu_mul_mat_parity
      # Model-backed GPU tests need a fixture, and until now no job had both a
      # GPU and a GGUF: this one has the adapter but fetched nothing, while
      # `parity` fetches fixtures and builds without `--features gpu`. So the
      # wgpu LFM2 prefill path had no end-to-end coverage at all.
      #
      # Only the `core` set (~270 MB) — it holds LFM2.5-230M-Q4_K_M, which is
      # what these tests want. `arch`-tier is 6.3 GB and buys nothing here.
      - name: Cache GGUF fixtures
        uses: actions/cache@v5
        with:
          path: target/oracle/models
          key: cera-parity-fixtures-core-${{ hashFiles('scripts/fetch_test_models.sh') }}
          restore-keys: |
            cera-parity-fixtures-core-
      - name: Fetch GGUF fixtures
        run: ./scripts/fetch_test_models.sh --set core
      # `CERA_REQUIRE_MODEL` makes an absent fixture fatal. Safe to set here
      # (unlike in `parity`, which fetches only `core` on a PR while four of its
      # tests want `arch`-tier models): everything below is satisfied by `core`,
      # so a skip would mean the job went green without running anything.
      #
      # Debug, not `--release`, to reuse the artifacts the step above just
      # built: a release build here would recompile the whole dependency graph
      # on a 2-core runner against this job's 20-minute cap. The tests are
      # dispatch-bound rather than CPU-bound (~9 s debug locally), so the
      # optimizer buys little.
      - name: Run wgpu LFM2 prefill equivalence + dispatch guard
        env:
          CERA_REQUIRE_MODEL: 1
        run: |
          cargo test -p cera --features gpu \
            --test gpu_lfm2_prefill_equivalence \
            --test gpu_lfm2_prefill_dispatch \
            --test gpu_lfm2_decode_passes \
            --test gpu_lfm2_greedy_submits \
            -- --nocapture
      # The GEMM microbenchmark carries `required-features = ["gpu"]`, so the
      # `check` job's `cargo clippy --all-targets` (no features) skips it and
      # nothing else in PR-time CI compiles it. Without this a change that breaks
      # it merges green and only fails later, in the nightly benchmark job — and
      # this is the tool `MUL_MAT_TILE_*` tells you to re-run before retuning.
      # Compile only: lavapipe would "run" it, but a software-Vulkan GFLOP/s
      # number is meaningless and the sweep is slow. `check`, not `clippy` --
      # clippy here would newly lint the whole gpu-featured lib and fail on
      # pre-existing warnings in code this has nothing to do with.
      - name: Check the GEMM microbenchmark compiles
        run: cargo check -p cera --features gpu --example wgpu_gemm_bench

  # Metal kernels *executed*, not merely compiled.
  #
  # Nothing else in CI runs an MSL kernel. `metal` is not a default feature, so
  # the `macos-latest` leg of `test` builds none of it. `cargo doc
  # --all-features` compiles the metal-gated Rust and stops there, and the
  # XCFramework job does run a binary — but its Swift smoke test exercises the
  # FFI surface without loading a model, so it dispatches no kernel either. MSL
  # is compiled at *runtime* through `new_library_with_source`, so a syntax or
  # semantic error in a `.metal` shader is invisible to all of them; it surfaces
  # when a kernel is first dispatched on a real device, i.e. in front of a user.
  #
  # Scope is the suites that build their inputs in-process and need no GGUF, so
  # this leg stays network-free. The model-loading Metal parity tests each carry
  # their own gate (`CERA_TEST_DOWNLOAD`, `CERA_LORA_METAL_PARITY`, a cached
  # model under `$HOME`) and stay out of it.
  #
  # `CERA_REQUIRE_METAL=1` turns "no Metal device" into a hard failure for the
  # suites that consult it — `metal_shaders_parity`, `metal_turboquant_oracle`,
  # `metal_kv_shift_oracle`, i.e. everything here that dispatches a kernel — so
  # those cannot report green on an empty test set. Mirrors `CERA_REQUIRE_GPU`
  # above and `CERA_REQUIRE_SIMD`; the two device-touching `--lib` tests honour
  # it too. `metal_params_layout` and `prefill_qpt_tests` are the only
  # device-optional pieces here — they check struct layouts and a pure helper.
  metal:
    name: Metal kernels (macos)
    needs: check
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      CERA_REQUIRE_METAL: 1
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
      - uses: Swatinem/rust-cache@v2
      # Filtered like the `simd-i8mm` leg: these are the only `metal`-gated
      # unit tests in the library, and an unfiltered `--lib` would re-run the
      # whole crate suite that `test (macos-latest)` already covers.
      #
      # libtest exits 0 when a filter matches nothing, so renaming either module
      # would turn this step into a silent no-op. Assert the count first — same
      # exhaustive-check discipline as the Android ABI `readelf` assertion and
      # the XCFramework slice verification.
      - name: Metal-gated unit tests
        run: |
          set -euo pipefail
          FILTERS="metal::tests:: prefill_qpt_tests::"
          # shellcheck disable=SC2086
          # `|| true`: grep -c exits 1 on zero matches, which under `set -e`
          # would abort here — precisely in the case this check exists to
          # report, and before the annotation below could explain why.
          COUNT=$(cargo test -p cera --features metal --lib -- --list $FILTERS \
                  | grep -c ': test$' || true)
          if [ "$COUNT" -ne 3 ]; then
            echo "::error::expected 3 metal-gated lib tests, found $COUNT — did a module get renamed? Update the filters in this job." >&2
            exit 1
          fi
          # `--nocapture` so `test_metal_context_init`'s device name reaches the
          # log: every sibling hardware leg identifies its device (gpu-tests
          # prints the Vulkan adapter, simd-i8mm the CPU tier), and this is the
          # leg whose whole premise is that the kernels ran on real silicon.
          # shellcheck disable=SC2086
          cargo test -p cera --features metal --lib -- --nocapture $FILTERS
      - name: Shader suites (dispatch real kernels)
        run: |
          cargo test -p cera --features metal --no-fail-fast \
            --test metal_shaders_parity \
            --test metal_turboquant_oracle \
            --test metal_kv_shift_oracle \
            --test metal_params_layout \
            --test slang_multitarget_parity

  build-release:
    name: Release Build
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --workspace --release

  wasm-build:
    # Phase 3 of the FFI multi-target plan is `cera-wasm` (browser/Node
    # via wasm-bindgen, not UniFFI). Before any of that lands the
    # foundation needs to hold: `cera` core has to compile for
    # `wasm32-unknown-unknown` across the feature combos that the
    # wasm-bindgen wrapper crate (Phase 3.2) might enable. Phase 1.3
    # (PR #32) made `parallel`, `mmap`, `std-fs`, `disk-cache`,
    # `remote` opt-in for exactly this reason; this job is a
    # regression check that catches the moment something in core adds
    # a non-target-conditional `std::thread`, `std::fs`, sync
    # primitive, etc. that breaks the wasm32 build under any of the
    # supported feature combos.
    #
    # `remote` is intentionally NOT in the matrix — `reqwest` doesn't
    # link on wasm32-unknown-unknown; cera-wasm will have its own
    # `fetch`-based adapter (Phase 3.x).
    name: Wasm Build (${{ matrix.features }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features"
          - "--no-default-features --features parallel,std-fs,disk-cache"
          - "--no-default-features --features mmap"
          # WebGPU backend (Track B PR 4.2) — the async wgpu host layer +
          # browser LFM2 session must keep compiling on wasm32. Native runtime
          # (WGSL kernels) is covered by the `gpu-tests` job above via lavapipe.
          - "--no-default-features --features gpu"
    # Restores the `+simd128` that `.cargo/config.toml` carries for wasm32. The
    # workflow-level `RUSTFLAGS: ""` is there to neutralize `target-cpu=native`
    # on the host, but an env `RUSTFLAGS` REPLACES the config's target entry
    # rather than appending to it, so this job has been compiling the scalar
    # fallback instead of the kernels that actually ship. The kernels compile
    # either way (they carry their own `#[target_feature]`), but the
    # `simd128`-gated dispatch arms in `vec_dot_*` are cfg'd out without this,
    # so the job would lint a configuration nothing ships. Repeating the flag
    # is what `WASM_MT_RUSTFLAGS` in the justfile has to do, for the same
    # reason.
    #
    # Safe for the whole job: every step below passes `--target`, and cargo does
    # not apply rustflags to host build scripts or proc macros when
    # cross-compiling, so `+simd128` never reaches a host artifact.
    env:
      RUSTFLAGS: "-C target-feature=+simd128"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint wasm32 compile
        # `clippy`, not `check`: it subsumes the compile check and is the only
        # lint coverage these feature combos get. The `check` job lints with no
        # `--features` at all, so every `#[cfg(not(feature = "parallel"))]`
        # fallback and every `gpu`-gated module is invisible to it. Seven
        # undocumented serial fallbacks in `backend/cpu.rs` accumulated in that
        # gap before anyone ran this locally.
        run: cargo clippy -p cera ${{ matrix.features }} --target wasm32-unknown-unknown -- -D warnings
      - name: Lint cera-wasm WebGPU surface
        # Runs once (on the gpu matrix entry): the browser `WebGpuSession`
        # glue in cera-wasm only builds with the `wgpu` feature, which the
        # cera-wasm-pack job doesn't enable.
        if: matrix.features == '--no-default-features --features gpu'
        run: cargo clippy -p cera-wasm --features wgpu --target wasm32-unknown-unknown -- -D warnings
      - name: Lint cera-wasm rustdoc
        # The `doc` job runs rustdoc on the HOST target, and `cera-wasm` is
        # wasm32-only — so nothing there documents this crate, and a broken
        # intra-doc link in it reaches `main` unnoticed (one did). The pack jobs
        # build wasm32 but never run rustdoc. This is the crate's only rustdoc
        # coverage.
        #
        # Rides the same gpu matrix entry as the check above so `--features wgpu`
        # documents the `WebGpuSession` surface too, and so it runs once rather
        # than once per feature combo.
        #
        # Worth more here than the usual "keep docs tidy": wasm-bindgen copies
        # doc comments verbatim into `cera_wasm.d.ts`, so these strings are
        # shipped API documentation for JS/TS consumers.
        if: matrix.features == '--no-default-features --features gpu'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p cera-wasm --features wgpu --no-deps --lib --target wasm32-unknown-unknown

  wasm-simd-kernels:
    # The `simd128` kernels in `cera/src/backend/simd.rs` are the only reason
    # browsers are not on the scalar path, and NOTHING else in CI executes
    # them: every other job either builds wasm32 without running it, or runs
    # tests on the host, where a wasm SIMD instruction cannot execute. A
    # host-only suite is green whether or not these kernels are correct.
    #
    # Each test is an oracle against the scalar reference in `crate::quant` —
    # the code wasm32 fell through to before the kernels existed — so "matches
    # scalar" is exactly the property that makes enabling them safe.
    name: Wasm SIMD Kernels
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The oracle tests here were not the thing that broke: they call the
    # kernels directly, and the kernels carry their own `#[target_feature]`,
    # so they were exercising real simd128 the whole time. What they could not
    # see is the dispatch, which the global flag gates and which decides
    # whether anything calls the kernels at all. Hence both halves: the flag
    # below, so this job runs the configuration that ships, and
    # `simd128_is_actually_enabled` in the suite, so a green run means the
    # dispatch is on rather than merely that the kernels are correct.
    env:
      RUSTFLAGS: "-C target-feature=+simd128"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      - uses: extractions/setup-just@v4
      - name: Run the simd128 kernel oracle tests under Node
        # Do not set RUSTFLAGS in this step. The job-level value above is
        # already `.cargo/config.toml`'s wasm32 entry, and a step-level one
        # would REPLACE it rather than append, testing the scalar dispatch.
        # This comment used to say `+simd128` came from the config and stop
        # there, which was true of a local run and not of this job: the
        # workflow-level `RUSTFLAGS: ""` had been overriding the config here
        # since it was added.
        run: just wasm-simd-test

  cera-wasm-pack:
    # Multi-target wasm-pack build. Each matrix entry produces one
    # consumer shape:
    #   - `bundler`: ESM with bundler-only `import * as wasm from
    #     "...wasm"` magic (webpack 5+, Vite, Rollup with the
    #     wasm plugin). Most common.
    #   - `web`: direct browser ESM that callers `init()` themselves
    #     before use. Right shape for `<script type="module">` and
    #     loaders without bundler-side wasm support.
    #   - `nodejs`: CommonJS for Node — `require('@hyeons-lab/cera-wasm')`
    #     without the experimental-wasm-modules dance.
    #
    # Three artifacts are uploaded so reviewers / downstream devs can
    # download whichever shape matches their consumer. The publish
    # workflow (deferred) will need to differentiate the npm package
    # names per target since wasm-pack writes the same scoped name
    # into all three pkg-*/package.json files today.
    #
    # `cargo build` regression check is preserved as a side-effect of
    # the wasm-pack pipeline (any of the three matrix entries failing
    # would catch a cera core regression).
    name: Cera-Wasm Pack (${{ matrix.target }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Built on every PR, so this is where a lost `+simd128` gets caught before
    # it reaches the release. Of the three npm shapes this job builds,
    # publish.yml publishes the bundler one today; web and nodejs are a
    # follow-up there (it does build a `--target web` wasm for the release
    # assets, by a different job). The v128 check below is the backstop that
    # makes this line's correctness verifiable rather than assumed.
    env:
      RUSTFLAGS: "-C target-feature=+simd128"
    strategy:
      fail-fast: false
      matrix:
        target: [bundler, web, nodejs]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # `taiki-e/install-action`, not `jetli/wasm-pack-action`: the latter is a
      # `node16` action with no newer release, so GitHub force-runs it on
      # node24 and warns. This one is a composite action, so it has no Node
      # runtime to deprecate at all. Same pinned wasm-pack version; note the
      # `tool:` form takes no leading `v`.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      - uses: ./.github/actions/install-binaryen
      - name: Build cera-wasm npm package
        # `--scope hyeons-lab` matches the package name advertised in
        # cera-wasm/README.md (`@hyeons-lab/cera-wasm`). `--out-dir`
        # gives each matrix entry its own directory so the artifact
        # uploads don't collide.
        run: |
          wasm-pack build cera-wasm \
            --target ${{ matrix.target }} \
            --release \
            --scope hyeons-lab \
            --out-dir pkg-${{ matrix.target }}
      - name: Assert the build has SIMD in it
        # The job-level RUSTFLAGS above is a claim; this checks the artifact.
        # Losing `+simd128` is invisible everywhere else: the build succeeds,
        # and the package gets SMALLER, because the kernels nothing dispatches
        # to any more are stripped.
        run: scripts/assert-wasm-simd.sh "cera-wasm/pkg-${{ matrix.target }}/cera_wasm_bg.wasm"
      - name: Check .wasm size budget
        # Hard cap on the post-wasm-opt cdylib size. Catches the
        # next time something bloats the bundle silently. Crossing
        # the budget is intentional sometimes (a real new capability,
        # not a regression) — when it happens, justify in the PR
        # description and bump `BUDGET_KB` here in the same commit.
        # Don't let a passing CI become a license to grow the wasm
        # without scrutiny.
        #
        # All three targets share the same wasm body (only the JS
        # glue differs); the gate fires per-target so any future
        # target-specific size regression surfaces immediately.
        #
        # Current floor (post wasm-opt -O3):
        #   PR #67 (manifest only):              174 KB
        #   PR #69 (engine + tokenizer):         1.2 MB  (+1.0 MB minijinja + LFM2)
        #   PR #70 (Session + generate):         1.2 MB  (~unchanged)
        #   PR #72 (applyChatTemplate):          2.0 MB  (+800 KB minijinja render)
        #   (drifted to, scalar):                2507 KB
        #   simd128 restored:                    2585 KB (+78 KB of vector code)
        # Budget:                                2816 KB (~9% headroom)
        #
        # That last entry is a bump, not a regression. The 2507 KB line is not
        # a release; it is what the artifact had quietly become while a
        # workflow-level `RUSTFLAGS: ""` was overriding `.cargo/config.toml`,
        # leaving no vector code in the build at all. The 78 KB back is the
        # `wasm_simd` kernels plus everything else LLVM vectorizes once it is
        # allowed to emit `v128`. Worth remembering the next time a wasm
        # artifact gets unexpectedly SMALLER.
        #
        # Plain bash arithmetic (no `numfmt` etc.) so this script
        # runs identically on the macOS / Linux developer machines
        # where contributors will sanity-check it locally.
        run: |
          set -euo pipefail
          PKG=cera-wasm/pkg-${{ matrix.target }}
          WASM=$PKG/cera_wasm_bg.wasm
          SIZE_BYTES=$(wc -c < "$WASM")
          BUDGET_KB=2816  # 2.75 MB
          BUDGET_BYTES=$((BUDGET_KB * 1024))
          # Display rounds UP to KB, so a 2,621,441-byte file reads as
          # "2561 KB" rather than "2560 KB". That keeps the human-readable
          # line honest with the byte-precision comparison below.
          SIZE_KB=$(( (SIZE_BYTES + 1023) / 1024 ))
          # Default $GITHUB_STEP_SUMMARY to /dev/null so a contributor
          # can copy this script and run it locally — the variable is
          # only set inside GitHub Actions, and `set -u` would
          # otherwise abort on the redirect.
          SUMMARY=${GITHUB_STEP_SUMMARY:-/dev/null}
          {
            echo "## Cera-Wasm Pack output (${{ matrix.target }})"
            echo
            echo "**\`$WASM\`: ${SIZE_KB} KB / ${BUDGET_KB} KB budget**"
            echo
            echo '```'
            ls -lh "$PKG/"
            echo '```'
          } >> "$SUMMARY"
          # Compare in bytes so the gate is a true hard cap; comparing
          # in KB would let a file overshoot by up to 1023 bytes
          # before failing.
          if [ "$SIZE_BYTES" -gt "$BUDGET_BYTES" ]; then
            echo "::error file=.github/workflows/ci.yml::$WASM is ${SIZE_KB} KB (${SIZE_BYTES} B), over the ${BUDGET_KB} KB (${BUDGET_BYTES} B) budget. If this is intentional (new capability, not a regression), bump BUDGET_KB in the same commit and justify in the PR description."
            exit 1
          fi
          echo "$WASM: ${SIZE_KB} KB / ${BUDGET_KB} KB budget — OK"
      - uses: actions/upload-artifact@v7
        with:
          name: cera-wasm-pkg-${{ matrix.target }}
          path: cera-wasm/pkg-${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 30

  cera-wasm-pack-mt:
    # Multi-threaded wasm-pack build. Mirrors `cera-wasm-pack`
    # above but flips on the `parallel` feature + the
    # `wasm-bindgen-rayon` thread-pool shim, so the resulting
    # package surfaces an `initThreadPool(numThreads)` JS export
    # that callers `await` once before driving inference. Only
    # `web` and `nodejs` targets are exercised — `wasm-bindgen-rayon`
    # doesn't have canonical bundler-side worker glue, so a
    # bundler-target threaded build is unsupported upstream.
    #
    # Build flags break down identically to the `wasm-web-mt` /
    # `wasm-node-mt` justfile recipes. This job does NOT catch drift
    # between the two, whatever this comment used to claim: it
    # hardcodes its own copy of the flag list rather than calling the
    # recipe, and that copy is exactly what went stale when `+simd128`
    # was added to the justfile and not here. The assert step below
    # catches that one flag going missing again; the rest of the list
    # is on the reader, apart from what the shared-memory /
    # initThreadPool step covers.
    name: Cera-Wasm Pack MT (${{ matrix.target }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The build step below assigns its own `RUSTFLAGS` inline, which shadows
    # this for that command. It is here so that a step added to this job later
    # inherits the feature instead of the workflow-level `RUSTFLAGS: ""`, and
    # so silently compiling scalar is not the default for new work.
    env:
      RUSTFLAGS: "-C target-feature=+simd128"
    strategy:
      fail-fast: false
      matrix:
        target: [web, nodejs]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
          targets: wasm32-unknown-unknown
          # `rust-src` is required for `-Z build-std`; the std
          # rebuild is what makes atomics-aware sync primitives
          # (Mutex/Arc/Atomic*) link against an atomics-built std.
          # Without this component the build fails before reaching
          # the linker.
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      # `taiki-e/install-action`, not `jetli/wasm-pack-action`: the latter is a
      # `node16` action with no newer release, so GitHub force-runs it on
      # node24 and warns. This one is a composite action, so it has no Node
      # runtime to deprecate at all. Same pinned wasm-pack version; note the
      # `tool:` form takes no leading `v`.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      - uses: ./.github/actions/install-binaryen
      - name: Build cera-wasm npm package (threaded)
        # Flag breakdown lives in the justfile next to
        # `WASM_MT_RUSTFLAGS`. Keep this command in lockstep —
        # if a flag changes there it must change here too. It had already
        # drifted: `+simd128` was added there and not here, which is the whole
        # reason the threaded packages this job builds were scalar.
        # The feature list below is byte-identical to the justfile's so the
        # next drift is visible by eye.
        run: |
          RUSTFLAGS="-C target-feature=+atomics,+bulk-memory,+mutable-globals,+simd128 \
            -C link-arg=--shared-memory \
            -C link-arg=--import-memory \
            -C link-arg=--max-memory=4294967296 \
            -C link-arg=--export=__wasm_init_tls \
            -C link-arg=--export=__tls_size \
            -C link-arg=--export=__tls_align \
            -C link-arg=--export=__tls_base \
            -C link-arg=--export=__heap_base" \
          wasm-pack build cera-wasm \
            --target ${{ matrix.target }} \
            --release \
            --scope hyeons-lab \
            --out-dir pkg-${{ matrix.target }}-mt \
            -- --features parallel \
            -Z build-std=panic_abort,std
      - name: Assert the build has SIMD in it
        # This job sets RUSTFLAGS itself, so it cannot inherit the feature and
        # has to carry `+simd128` in its own flag list. It did not, so the
        # threaded packages it builds were scalar.
        run: scripts/assert-wasm-simd.sh "cera-wasm/pkg-${{ matrix.target }}-mt/cera_wasm_bg.wasm"
      - name: Verify threaded artifact has shared memory + initThreadPool
        # Two-pronged sanity check that catches the most common
        # silent regression: the build succeeds but produces a
        # wasm without shared memory (i.e. atomics weren't applied
        # correctly) or without the JS thread-pool entry point
        # (i.e. wasm-bindgen-rayon got DCE'd out).
        run: |
          set -euo pipefail
          PKG=cera-wasm/pkg-${{ matrix.target }}-mt
          WASM=$PKG/cera_wasm_bg.wasm
          DTS=$PKG/cera_wasm.d.ts
          # `wasm-objdump` ships in `wabt`; `binaryen` (already
          # installed above for `wasm-opt`) doesn't include it,
          # so we install wabt here only — keeps the main
          # cera-wasm-pack job's install step lean.
          sudo apt-get install -y wabt
          MEM_LINE=$(wasm-objdump -j Import -x "$WASM" | grep '^ - memory\[0\]' || true)
          if ! echo "$MEM_LINE" | grep -q 'shared'; then
            echo "::error::$WASM imports memory without 'shared' flag — atomics build is broken"
            echo "Memory import line: $MEM_LINE"
            exit 1
          fi
          if ! grep -q 'initThreadPool' "$DTS"; then
            echo "::error::$DTS missing initThreadPool export — wasm-bindgen-rayon got DCE'd"
            exit 1
          fi
          echo "$WASM: shared memory + initThreadPool present — OK"
      - name: Check threaded .wasm size budget
        # Threaded wasm is bigger than the single-threaded body
        # because the std rebuild includes atomics-aware sync
        # primitives + TLS init. 2666 KB measured for both
        # targets with `+simd128` in the build step's flag list
        # above; the 3072 KB budget gives ~15% headroom for std /
        # wasm-bindgen-rayon churn before this needs a bump.
        # Crossing the budget is intentional sometimes (a real
        # new capability, not a regression) — when it happens,
        # justify in the PR description and bump `BUDGET_KB`
        # here in the same commit.
        run: |
          set -euo pipefail
          PKG=cera-wasm/pkg-${{ matrix.target }}-mt
          WASM=$PKG/cera_wasm_bg.wasm
          SIZE_BYTES=$(wc -c < "$WASM")
          BUDGET_KB=3072  # 3 MB; see the note above for the measurement
          BUDGET_BYTES=$((BUDGET_KB * 1024))
          SIZE_KB=$(( (SIZE_BYTES + 1023) / 1024 ))
          SUMMARY=${GITHUB_STEP_SUMMARY:-/dev/null}
          {
            echo "## Cera-Wasm Pack MT output (${{ matrix.target }})"
            echo
            echo "**\`$WASM\`: ${SIZE_KB} KB / ${BUDGET_KB} KB budget**"
            echo
            echo '```'
            ls -lh "$PKG/"
            echo '```'
          } >> "$SUMMARY"
          if [ "$SIZE_BYTES" -gt "$BUDGET_BYTES" ]; then
            echo "::error file=.github/workflows/ci.yml::$WASM is ${SIZE_KB} KB (${SIZE_BYTES} B), over the ${BUDGET_KB} KB (${BUDGET_BYTES} B) budget. If this is intentional (new capability, not a regression), bump BUDGET_KB in the same commit and justify in the PR description."
            exit 1
          fi
          echo "$WASM: ${SIZE_KB} KB / ${BUDGET_KB} KB budget — OK"
      - uses: actions/upload-artifact@v7
        with:
          name: cera-wasm-pkg-${{ matrix.target }}-mt
          path: cera-wasm/pkg-${{ matrix.target }}-mt/
          if-no-files-found: error
          retention-days: 30

  ffi-bindings-drift:
    # Verifies the committed Kotlin + Swift bindings under
    # cera-ffi/bindings/, and the SwiftPM wrapper copy under
    # cera-ffi/apple/Sources/Cera/, stay in sync with the Rust
    # `#[uniffi::*]` surface. Regenerates via `uniffi-bindgen` (the in-repo
    # binary target) against the freshly-built debug dylib and fails if
    # `git diff` shows changes — signalling someone touched the FFI
    # exports without running `just bindings` and committing the result.
    #
    # Skips Kotlin/Swift compilation: we're only checking that the
    # generator produces the same bytes for the same input. No JDK /
    # Swift toolchain needed beyond `ktlint` (which uniffi-bindgen
    # invokes on the Kotlin output so the committed file stays
    # formatter-stable).
    name: FFI Bindings Drift
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
      - uses: Swatinem/rust-cache@v2
      - name: Install ktlint
        # Pin the ktlint version + verify its sha256 so the formatter
        # output is reproducible across CI runs + developer workstations
        # AND so a compromised mirror can't slip a different binary past
        # the drift check. Bump in lockstep with whatever's documented
        # in cera-ffi/README.md (regenerate the bindings in the same PR).
        #
        # `curl --fail --proto '=https' --tlsv1.2` hardens the download
        # against silent HTTP errors and legacy TLS downgrades.
        # The sha256 below is for the ktlint 1.8.0 standalone release
        # binary from pinterest/ktlint; bumping the version requires
        # recomputing it (locally: `shasum -a 256 ktlint`).
        run: |
          KTLINT_VERSION=1.8.0
          KTLINT_SHA256=a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75
          curl --fail --proto '=https' --tlsv1.2 -sSLo /tmp/ktlint \
            "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          echo "${KTLINT_SHA256}  /tmp/ktlint" | sha256sum -c -
          chmod +x /tmp/ktlint
          sudo mv /tmp/ktlint /usr/local/bin/ktlint
          ktlint --version
      - uses: extractions/setup-just@v4
      - name: Regenerate bindings and diff
        # `just bindings-check` rather than a copy of its commands. This job
        # used to inline them, and the copy was already incomplete: it never
        # wrote the committed SwiftPM wrapper at cera-ffi/apple/, which drifted
        # ~800 lines behind the Rust surface unnoticed. Calling the recipe means
        # the local and CI definitions cannot disagree again.
        run: just bindings-check

  dart-bindings-drift:
    # Same idea as ffi-bindings-drift, for the committed Dart bindings under
    # cera_ffi/lib/src/generated/.
    #
    # This job exists because its absence already cost us: the Dart bindings
    # silently fell ~3 weeks behind the Rust FFI surface (missing three
    # `GenerateOpts` fields and `encode_text_special`), and since UniFFI
    # checksums every method at construction, the package could not even open
    # the library. `just dart-bindings-check` existed the whole time; nothing
    # ran it.
    #
    # Unlike the Kotlin/Swift job this also analyzes and tests the package,
    # because the generated Dart is the shipped artifact rather than an input
    # to another compiler.
    name: Dart Bindings Drift
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
      - uses: Swatinem/rust-cache@v2
      # Flutter, not `dart-lang/setup-dart`, because the recipe checks BOTH
      # packages: `cera_ffi` with plain `dart` (proving it still resolves
      # without Flutter, which is the reason it exists) and `cera_ffi_flutter`
      # with `flutter`, which it cannot avoid needing. Flutter ships a Dart SDK,
      # so one install covers both; the `sdk: ^3.3.0` floor is satisfied by any
      # current stable Flutter.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: extractions/setup-just@v4

      - name: Regenerate, diff, and analyze
        # Runs the recipe instead of a copy of it. The steps here used to be
        # inlined "to avoid installing just", and promptly drifted: the recipe
        # moved to `flutter pub get`/`flutter analyze` while this job kept
        # calling `dart`, and the job failed on a package it had itself
        # declared healthy the previous week.
        #
        # The recipe builds cera-ffi with `--features ffi-buffer` (the Dart
        # generator emits calls to `uniffi_ffibuffer_*` trampolines, which
        # UniFFI exports only under that feature; Kotlin and Swift use the
        # standard symbols), regenerates + patches the bindings in place, fails
        # on any diff against what is committed, and analyzes both packages.
        run: just dart-bindings-check

      - name: Assert no method is stubbed out
        # A regression in the generator's return-type handling shows up as a
        # `throw UnsupportedError` in place of a real body, which `dart analyze`
        # is perfectly happy with. Every method now has a real implementation,
        # so any hit here means one silently stopped working.
        run: |
          cd cera_ffi
          unexpected=$(grep -n "not implemented yet" lib/src/generated/cera_ffi.dart || true)
          if [ -n "${unexpected}" ]; then
            echo "::error::Generated bindings contain unexpected runtime stubs:"
            echo "${unexpected}"
            exit 1
          fi

      # Analysis happens inside `just dart-bindings-check` above, which has also
      # already resolved the package.
      - name: Test
        run: cd cera_ffi && dart test

      - name: Web build (the web implementation compiles for a browser)
        # The one check that cannot be done from the VM. Two separate things
        # only a browser build can prove:
        #
        # 1. `Cera`'s web implementation compiles. It is real code (dart:js_interop
        #    extension types, a Worker, transferable buffers) that no VM test
        #    ever loads, so `dart analyze` passing is not the same as it
        #    compiling. dart2js is what type-checks the interop.
        # 2. The generated stub still carries the full binding surface (below).
        #
        # A dart:ffi import anywhere on the graph fails the entire build, so this
        # catches the stub falling behind the bindings — a member added to one and
        # not the other — which no VM test can see. `dart test` covers the other
        # half, that the stub's entry points throw.
        #
        # Built here rather than in its own job to reuse this one's Flutter
        # install: a separate runner would cost more than the step does.
        #
        # It depends on `cera_ffi_flutter`, not `cera_ffi`, because that is what
        # an app depends on, and the re-export is part of what has to compile.
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          flutter create --platforms web -t app "$WORK/probe" >/dev/null
          cd "$WORK/probe"
          # Overrides first: `pub add` resolves immediately, and the plugin's pin
          # on `cera_ffi` is a version that need not exist on pub.dev yet.
          cat > pubspec_overrides.yaml <<EOF
          dependency_overrides:
            cera_ffi:
              path: ${GITHUB_WORKSPACE}/cera_ffi
          EOF
          flutter pub add cera_ffi_flutter --path "${GITHUB_WORKSPACE}/cera_ffi_flutter" >/dev/null
          cat > lib/main.dart <<'EOF'
          import 'dart:async';
          import 'dart:typed_data';

          import 'package:flutter/material.dart';
          import 'package:cera_ffi_flutter/cera_ffi_flutter.dart';

          // Touches a data type, a top-level function, an object constructor and
          // the loader. Referencing them is the point: dart2js only reports a
          // missing name if something names it. The same goes for every `Cera`
          // member below: an uncalled method is a method dart2js never checks.
          Future<void> exerciseCera() async {
            debugPrint('supportsPaths=${Cera.supportsPaths}');
            try {
              await Cera.openPath('model.gguf');
            } on UnsupportedError catch (e) {
              debugPrint('expected on web: ${e.message}');
            }
            // Never reached (no worker is served here), but it has to compile.
            if (DateTime.now().year < 2000) {
              final cera = await Cera.openBytes(
                Uint8List(0),
                options: const CeraOptions(
                  contextSize: 512,
                  backend: CeraBackend.gpu,
                  web: CeraWebAssets(workerUrl: 'w.js', moduleUrl: 'm.js'),
                ),
              );
              debugPrint(cera.backend);
              await for (final piece in cera.generate('hi', maxTokens: 1)) {
                debugPrint(piece);
              }
              debugPrint(await cera.applyChatTemplate([const CeraMessage.user('hi')]));
              debugPrint('${await cera.encode('hi')}');
              debugPrint(await cera.decode(const [1]));
              await cera.reset();
              await cera.cancel();
              await cera.close();
            }
          }

          void main() {
            const config = EngineConfig(
              contextSize: 2048,
              backend: BackendPreference.cpu,
              bundleRepo: null,
            );
            debugPrint('${config.contextSize} ${CeraLibrary.pathEnvVar}');
            try {
              debugPrint(ceraFfiVersion());
              CeraEngine.fromPath('model.gguf', config);
            } on UnsupportedError catch (e) {
              debugPrint('expected on web: ${e.message}');
            }
            unawaited(exerciseCera());
            runApp(const MaterialApp(home: Scaffold(body: Text('ok'))));
          }
          EOF
          flutter build web
          test -f build/web/main.dart.js
          echo "web build OK: Cera's web impl compiles and the stub carries the full API surface"

      - name: install_web puts the runtime where the defaults look for it
        # `Cera`'s web defaults point at `web/cera/`, and the tool is what puts
        # anything there. A default that names a path nothing writes is a
        # broken-out-of-the-box package, and the failure would surface as a
        # worker that never loads.
        #
        # The wasm pair is faked rather than built: this asserts the tool's
        # placement and naming contract, and building cera-wasm here to check a
        # file copy would cost minutes. The real artifacts are exercised by the
        # wasm jobs.
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          mkdir -p "$WORK/fake" "$WORK/app"
          : > "$WORK/fake/cera_wasm.js"
          : > "$WORK/fake/cera_wasm_bg.wasm"
          cd "$WORK/app"
          cat > pubspec.yaml <<EOF
          name: install_web_probe
          publish_to: none
          environment: {sdk: ^3.3.0}
          dependencies:
            cera_ffi: {path: ${GITHUB_WORKSPACE}/cera_ffi}
          EOF
          dart pub get >/dev/null
          dart run cera_ffi:install_web --from "$WORK/fake"
          for f in cera_worker.js cera_wasm.js cera_wasm_bg.wasm; do
            test -f "web/cera/$f" || { echo "install_web did not write web/cera/$f"; exit 1; }
          done
          # Non-empty, i.e. the worker really came from the package rather than
          # from the same `: >` that made the fakes.
          test -s web/cera/cera_worker.js
          echo "install_web OK"

      - name: Generator unit tests
        run: cargo test --manifest-path third_party/uniffi-bindgen-dart/Cargo.toml

  flutter-desktop-build:
    # Builds the Flutter example app for the desktop platforms, which is the
    # only way their plugin wiring gets exercised at all: Linux and Windows go
    # through CMakeLists that Flutter's own build drives, and nothing else in
    # CI runs them.
    #
    # It uses the plugin's local-library override rather than the release
    # download on purpose. Two reasons: a PR must not depend on a published
    # release existing, and this way the job tests the CMake wiring against the
    # library built from *this* commit instead of whatever last shipped.
    #
    # The library is built with `--features ffi-buffer` and then asserted,
    # because omitting it produces a plugin that builds and bundles perfectly
    # and fails at the first Dart call. That shipped to every platform once.
    name: Flutter Desktop Build
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  platform: linux,   lib: libcera_ffi.so, dest: cera_ffi_flutter/linux }
          - { os: windows-latest, platform: windows, lib: cera_ffi.dll,   dest: cera_ffi_flutter/windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Linux desktop build deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Build cera-ffi and stage it as the plugin's local library
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p cera-ffi --release --features ffi-buffer
          cp "target/release/${{ matrix.lib }}" "${{ matrix.dest }}/${{ matrix.lib }}"
          scripts/assert-ffibuffer.sh "${{ matrix.dest }}/${{ matrix.lib }}"

      - name: Build the example app
        shell: bash
        run: cd cera_ffi_flutter/example && flutter pub get && flutter build ${{ matrix.platform }} --debug

      - name: Assert the library was bundled with the app
        # Flutter copies whatever the plugin lists in
        # `<plugin>_bundled_libraries` next to the executable; that placement is
        # what makes the bare-name `DynamicLibrary.open` in library_loader_io
        # resolve at runtime. If the CMake contract breaks, the app still builds
        # and only fails when a user runs it.
        shell: bash
        run: |
          set -euo pipefail
          found=$(find cera_ffi_flutter/example/build -name "${{ matrix.lib }}" | head -1)
          if [ -z "$found" ]; then
            echo "::error::${{ matrix.lib }} was not bundled with the built app"
            exit 1
          fi
          echo "bundled at: $found"
          scripts/assert-ffibuffer.sh "$found"

  android-abis:
    # Cross-compiles `cera-ffi` to every Android ABI supported by the
    # Android NDK (arm64-v8a, armeabi-v7a, x86_64, x86). Verifies each
    # `.so` is a valid ELF of the right architecture and uploads the
    # release libraries as a CI artifact so consumers can grab a
    # Jetpack-friendly `jniLibs/` layout from the action run without
    # running the toolchain themselves.
    #
    # Matrix entry per ABI keeps the six-ish-minute cross-compile from
    # being the critical path on a green CI run: all four run in
    # parallel. Release profile mirrors the size target
    # (~2.5 MB/.so vs ~75 MB for debug with embedded debuginfo).
    name: Android ABI (${{ matrix.abi }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
          - abi: armeabi-v7a
            rust_target: armv7-linux-androideabi
          - abi: x86_64
            rust_target: x86_64-linux-android
          - abi: x86
            rust_target: i686-linux-android
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
      # Install NDK. Pin to r27c — a validated stable release the
      # workspace builds against cleanly. Bumping is a one-line change:
      # update this version string (and the matching note in
      # cera-ffi/README.md) and re-run CI to confirm every ABI still
      # builds. The `cargo ndk` flag shape is compatible across recent
      # NDK majors so the pin is about toolchain + sysroot stability
      # across runs, not a hard constraint.
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Install cargo-ndk
        # Pin to 4.x major — cargo-ndk 4.0 changed the flag shape
        # (`--target <abi>` is the current form; earlier releases
        # used `--platform` + `--arch`). Let cargo pick the latest
        # 4.x patch so security-fix releases get picked up.
        run: cargo install cargo-ndk --version '^4' --locked
      - name: Cross-compile cera-ffi
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk --target ${{ matrix.abi }} build -p cera-ffi --release
      - name: Verify ELF shape
        # Catches a regression where `cargo build` succeeds but the
        # cdylib rule silently produces a host-arch binary. Assert
        # via `readelf -h`'s `Class:` + `Machine:` fields — those are
        # machine-readable ELF header values that don't drift across
        # distro versions the way `file(1)`'s human-readable string
        # does. `file` is kept for diagnostic output only.
        #
        # Catch-all `*)` arm is deliberate: if someone extends the
        # matrix with a new ABI and forgets to add an assertion
        # branch, this step fails loudly instead of silently
        # passing. Same pattern as exhaustive `match` on a Rust enum.
        run: |
          SO=target/${{ matrix.rust_target }}/release/libcera_ffi.so
          ls -la "$SO"
          file "$SO"
          HEADER=$(readelf -h "$SO")
          printf '%s\n' "$HEADER"
          case "${{ matrix.abi }}" in
            arm64-v8a)
              printf '%s\n' "$HEADER" | grep -Eq '^[[:space:]]*Class:[[:space:]]*ELF64$'
              printf '%s\n' "$HEADER" | grep -Eq '^[[:space:]]*Machine:[[:space:]]*AArch64$'
              ;;
            armeabi-v7a)
              printf '%s\n' "$HEADER" | grep -Eq '^[[:space:]]*Class:[[:space:]]*ELF32$'
              printf '%s\n' "$HEADER" | grep -Eq '^[[:space:]]*Machine:[[:space:]]*ARM$'
              ;;
            x86_64)
              printf '%s\n' "$HEADER" | grep -Eq '^[[:space:]]*Class:[[:space:]]*ELF64$'
              printf '%s\n' "$HEADER" | grep -Eq '^[[:space:]]*Machine:[[:space:]]*Advanced Micro Devices X86-64$'
              ;;
            x86)
              printf '%s\n' "$HEADER" | grep -Eq '^[[:space:]]*Class:[[:space:]]*ELF32$'
              printf '%s\n' "$HEADER" | grep -Eq '^[[:space:]]*Machine:[[:space:]]*Intel 80386$'
              ;;
            *)
              echo "::error::Unexpected ABI for ELF verification: ${{ matrix.abi }} — extend the case branch above." >&2
              exit 1
              ;;
          esac
      - name: Log .so size
        # Per-ABI size + the artifact name reviewers will look for
        # in the run page sidebar. Mirrors the size-summary pattern
        # used by `cera-wasm-pack` / `apple-xcframework` so every
        # artifact-producing job surfaces info the same way.
        run: |
          set -euo pipefail
          SO=target/${{ matrix.rust_target }}/release/libcera_ffi.so
          ls -lh "$SO"
          SUMMARY=${GITHUB_STEP_SUMMARY:-/dev/null}
          {
            echo "## Android \`${{ matrix.abi }}\` artifact"
            echo
            echo "Release \`.so\` (post-strip, LTO):"
            echo
            echo '```'
            ls -lh "$SO"
            echo '```'
            echo
            echo "Download: artifact \`cera-ffi-android-${{ matrix.abi }}\` on this run page."
          } >> "$SUMMARY"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cera-ffi-android-${{ matrix.abi }}
          path: target/${{ matrix.rust_target }}/release/libcera_ffi.so
          # Per-run artifact; 7-day retention is enough to copy into
          # a consumer app's `src/main/jniLibs/<abi>/` for testing
          # without keeping stale binaries around.
          retention-days: 7

  apple-xcframework:
    # Cross-compiles cera-ffi to all three arm64-only Apple-platform
    # Rust targets and assembles `CeraFFI.xcframework` ready for
    # Swift Package Manager / Xcode consumption. Three slices end up
    # in the framework:
    #   - ios-arm64           (real iPhones / iPads)
    #   - ios-arm64-simulator (Apple Silicon Mac iOS Simulator)
    #   - macos-arm64         (native Apple Silicon Macs)
    #
    # x86_64 slices are deliberately omitted: Apple stopped selling
    # Intel Macs in 2023 and modern consumer apps don't need to ship
    # for them. Drops the framework size from ~211 MB (with fat
    # slices) to ~125 MB and removes the `lipo -create` step entirely
    # — each slice is a single-arch staticlib piped straight into
    # xcodebuild. If an Intel-Mac consumer ever needs to be added
    # later, the structural change is reversible (bring back the
    # x86_64 rustup targets + lipo steps).
    #
    # Pinned to `macos-15` explicitly (Apple Silicon M1 runner image)
    # rather than `macos-latest`: every artifact we produce is
    # arm64-only, and `swiftc` on an Intel host would default to
    # x86_64 and silently build a binary that fails to link against
    # the aarch64 staticlib. An `uname -m` assertion below turns a
    # future runner-image tier change into a loud early failure.
    # Single job (no matrix) — the cross-compile builds are serial
    # inside the recipe; matrix wouldn't help because the final
    # xcodebuild step needs every slice in one workspace.
    #
    # The workflow-level `RUSTFLAGS: ""` env override is critical for
    # the macOS slice: `.cargo/config.toml` sets target-cpu=native
    # for the apple-darwin triple (workstation dev convenience), but
    # a CI runner's "native" CPU isn't a portable shipped-binary
    # baseline. Empty RUSTFLAGS forces the generic apple-darwin
    # baseline for distribution.
    name: Apple XCFramework
    needs: check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Show runner info
        # Xcode version: diagnostic — the `macos-15` pin tracks an
        # image version, not a frozen Xcode version, so logging
        # catches silent xcodebuild behavior changes.
        #
        # `uname -m` assertion: every output of this job is arm64-
        # only. If a future `macos-15` image tier adds an Intel
        # host variant (or if we ever point back at `macos-latest`),
        # this fails fast with an actionable error instead of
        # silently producing a mislinked Swift binary against the
        # aarch64 staticlib.
        run: |
          set -euo pipefail
          xcodebuild -version
          uname -m
          ARCH=$(uname -m)
          if [ "$ARCH" != "arm64" ]; then
            echo "::error::expected arm64 host for arm64-only cross-compile, got '$ARCH' — pin runs-on to an Apple Silicon label" >&2
            exit 1
          fi
      - uses: extractions/setup-just@v4
      - name: Build XCFramework
        # Runs the recipe rather than a copy of it. This step used to be
        # inlined, with a comment claiming it mirrored the recipe exactly;
        # it did not. It had drifted to static `-library` slices, the old
        # pre-`ffi_module_name` header names, and no `ffi-buffer` feature,
        # so it verified an XCFramework that no longer resembled the one
        # `just apple-xcframework` (and the release) produces. Installing
        # `just` is cheaper than that class of silent divergence.
        #
        # Deployment targets, Metal, and ffi-buffer all live in the recipe.
        run: just apple-xcframework
      - name: Log XCFramework size
        # Logs the per-slice + total size so a future regression where
        # debuginfo slips back in (or a heavyweight dep accidentally
        # gets feature-gated on) shows up as a number in the build
        # log AND in the per-job summary block (so reviewers can
        # eyeball drift directly from the run page without diving
        # into the build log).
        #
        # `du -sh` output goes to both stdout (build log) and the
        # `$GITHUB_STEP_SUMMARY` markdown file for the per-run
        # summary. Mirrors the size-reporting pattern used by
        # `cera-wasm-pack` / `cera-wasm-pack-mt`. Default
        # `$GITHUB_STEP_SUMMARY` to `/dev/null` so a contributor
        # can copy this script and run it locally — the variable
        # only exists inside GitHub Actions and `set -u` would
        # otherwise abort on the redirect.
        run: |
          set -euo pipefail
          XCF=target/xcframework-build/CeraFFI.xcframework
          du -sh "$XCF"
          du -sh "$XCF"/*/CeraFFI.framework
          SUMMARY=${GITHUB_STEP_SUMMARY:-/dev/null}
          {
            echo "## Apple XCFramework artifact"
            echo
            echo "Total + per-slice sizes (post-strip, release profile):"
            echo
            echo '```'
            du -sh "$XCF"
            du -sh "$XCF"/*/CeraFFI.framework
            echo '```'
            echo
            echo "Slices: \`ios-arm64\` + \`ios-arm64-simulator\` + \`macos-arm64\` (no x86_64 — Apple Silicon-only)."
            echo
            echo "Download: artifact \`cera-ffi-apple-xcframework\` on this run page."
          } >> "$SUMMARY"
      - name: Swift smoke test (macOS)
        # Validates the entire pipeline end-to-end: compiles a small
        # Swift program against the freshly-built macOS staticlib +
        # the vendored Swift binding, runs it, asserts every surface
        # area we expect to work works (function call, enum
        # marshaling, record construction, error round-trip).
        #
        # Why macOS only: the Rust FFI surface is identical across
        # iOS device, iOS Simulator, and native macOS — same
        # generated Swift binding, same C ABI, same staticlib code
        # path. Running a native macOS test exercises the entire
        # cross-language integration without paying for an iOS
        # simulator boot. A regression that broke iOS specifically
        # (e.g., a platform-conditional staticlib symbol) wouldn't
        # be caught here, but those have not been a real failure
        # mode for UniFFI 0.31.
        #
        # `-import-objc-header` exposes the C declarations from
        # `CeraFFI.h` without needing a separate module map + SPM
        # ceremony for a single-binary test. Foundation auto-links on
        # Apple platforms. The header is named after `ffi_module_name`
        # in cera-ffi/uniffi.toml; change it there and this follows.
        run: |
          set -euo pipefail
          swiftc \
              cera-ffi/tests/swift/main.swift \
              cera-ffi/bindings/swift/cera_ffi.swift \
              -import-objc-header cera-ffi/bindings/swift/CeraFFI.h \
              -L target/aarch64-apple-darwin/release \
              -lcera_ffi \
              -framework Metal \
              -o /tmp/cera-swift-smoke
          /tmp/cera-swift-smoke
      - name: Verify XCFramework slices
        # Catches a regression where one slice silently has the wrong
        # architecture or platform — `Info.plist` advertises
        # `SupportedPlatform` + `SupportedPlatformVariant` +
        # `SupportedArchitectures`, all three must match what we
        # intended to build. Same exhaustive-check discipline as the
        # Android ABI matrix's `readelf` assertion.
        #
        # `SupportedPlatform == "ios"` is a critical guard: without
        # it, a misconfigured cross-compile that produced a macOS
        # staticlib (`aarch64-apple-darwin`) could still satisfy the
        # arch + variant checks since macOS arm64 staticlibs declare
        # the same architecture. The `==` on platform forces the
        # iOS-specific path.
        run: |
          set -euo pipefail
          XCF=target/xcframework-build/CeraFFI.xcframework
          test -d "$XCF" || { echo "::error::xcframework not built"; exit 1; }
          plutil -p "$XCF/Info.plist"
          plutil -convert json -o - "$XCF/Info.plist" | python3 -c '
          import json, sys
          info = json.load(sys.stdin)
          libs = info["AvailableLibraries"]
          if len(libs) != 3:
              print(f"::error::expected 3 slices, got {len(libs)}", file=sys.stderr); sys.exit(1)
          # Build a set of (platform, archs-sorted-tuple, variant) keys
          # and check both expected slices are present. (*archs,
          # variant) avoids a tuple-concat dance that earlier readers
          # misread as a syntax bug.
          actual = {(l["SupportedPlatform"], *sorted(l["SupportedArchitectures"]), l.get("SupportedPlatformVariant", "")) for l in libs}
          expected = {
              ("ios",   "arm64", ""),          # iOS device
              ("ios",   "arm64", "simulator"), # iOS Simulator (Apple Silicon Mac host)
              ("macos", "arm64", ""),          # native Apple Silicon Mac
          }
          missing = expected - actual
          extra = actual - expected
          if missing or extra:
              print(f"::error::xcframework slices mismatch", file=sys.stderr)
              print(f"  expected: {expected}", file=sys.stderr)
              print(f"  actual:   {actual}", file=sys.stderr)
              if missing: print(f"  missing:  {missing}", file=sys.stderr)
              if extra:   print(f"  extra:    {extra}", file=sys.stderr)
              sys.exit(1)
          print("xcframework slices OK: ios-arm64 + ios-arm64-simulator + macos-arm64")
          '
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cera-ffi-apple-xcframework
          # Upload the directory (xcframework is a folder bundle on
          # disk); actions/upload-artifact zips it transparently.
          path: target/xcframework-build/CeraFFI.xcframework
          retention-days: 7

  batched-prefill-parity:
    name: Batched Prefill Parity
    needs: check
    runs-on: ubuntu-latest
    # Unlike the other fixture-backed jobs this runs on PRs too. Those pull
    # multi-hundred-MB bundles for end-to-end checks; this pulls 267 MB once
    # and then runs in ~25 s off a warm cache, and it guards the class of bug
    # that is invisible without it — a batched GEMM that produces plausible
    # wrong numbers rather than crashing.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
      - uses: Swatinem/rust-cache@v2
      # OpenBLAS for the `blas` leg below.
      - name: Install OpenBLAS
        run: |
          # See the integration-test job: a broken packages.microsoft.com
          # InRelease intermittently breaks apt update on these runners.
          while IFS= read -r f; do
            sudo rm -f -- "$f"
          done < <(grep -Frl packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null || true)
          sudo apt-get update && sudo apt-get install -y libopenblas-dev
      # On a PR this is the `core` set (267 MB): both int8 GEMM kernels plus the
      # K-quant path. On a main push or manual dispatch it is `all` (6.3 GB),
      # adding the dense-transformer fixtures. Two separate cache entries rather
      # than one, so the per-PR restore stays small — GitHub allows 10 GB of
      # cache per repo in total, and a 6.3 GB entry restored on every PR would
      # evict the rust and gradle caches the other jobs depend on.
      - name: Select fixture set
        id: fixtures
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "set=core" >> "$GITHUB_OUTPUT"
          else
            echo "set=all" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache GGUF parity fixtures
        uses: actions/cache@v5
        with:
          path: target/oracle/models
          # Keyed on a hash of the fetch script rather than a hand-bumped
          # suffix like the older cache entries: the script holds the fixture
          # names, URLs and checksums, so any fixture change invalidates the
          # key on its own and nobody has to remember to bump it.
          key: cera-parity-fixtures-${{ steps.fixtures.outputs.set }}-${{ hashFiles('scripts/fetch_test_models.sh') }}
          # Restore an older fixture set on a miss. The fetch script verifies
          # each file's checksum and refetches only what is missing or wrong,
          # so a one-fixture change costs one download rather than all of them.
          restore-keys: |
            cera-parity-fixtures-${{ steps.fixtures.outputs.set }}-
      - name: Fetch GGUF fixtures
        run: ./scripts/fetch_test_models.sh --set ${{ steps.fixtures.outputs.set }}
      # The no-blas leg's coverage depends on the runner's ISA, so record what
      # this one actually is. Without it, a green run is ambiguous between
      # "batched path verified" and "batched path skipped for lack of avx2+fma"
      # (the bar used to be VNNI; the AVX2 int8 kernels lowered it).
      - name: Report CPU tier
        run: cargo run --release -q -p cera-cli -- cpu
      # Leg 1 — deterministic. With `blas` the batched path is OpenBLAS SGEMM,
      # which every runner has, so this leg cannot skip for lack of hardware
      # and its green is always meaningful. (`CERA_REQUIRE_BATCHED` is
      # deliberately NOT set: the liveness check is `cfg(not(feature = "blas"))`,
      # so under `blas` it compiles out and the variable would assert nothing —
      # setting it here would look like a guarantee while doing nothing.)
      - name: Parity (blas batched path)
        run: |
          cargo test -p cera --release --features blas --no-fail-fast \
            --test llama_batched_prefill_parity \
            --test lfm2_batched_prefill_parity \
            -- --ignored --nocapture
      # Leg 2 — opportunistic. Covers the x86_64 int8 path, which is what the
      # CPU backend actually uses in a default build. Deliberately does NOT set
      # CERA_REQUIRE_BATCHED, and a missing instruction set is a coverage gap to
      # read in the log (the tests print an explicit SKIP line), not a build
      # failure.
      #
      # The original reason for that caution — "runners are not guaranteed to
      # expose VNNI" — no longer applies: the int8 GEMM/GEMV are now instantiated
      # at the AVX2 tier too (`dpbusd` emulated with `maddubs`), so any avx2+fma
      # runner exercises the batched path, and every GitHub-hosted x86 runner has
      # AVX2. Promoting this leg to required by setting CERA_REQUIRE_BATCHED=1 is
      # now a one-line change; it is left off here only because flipping a leg
      # from advisory to blocking is a policy call, not a technical one.
      # `unbatchable_warning` rides along here, not in the main Test job: it
      # needs a fixture, and that job has none, so there it skips silently and
      # reports a pass. It is native-leg only — the test is
      # `cfg(not(feature = "blas"))`, since it forces the fallback by
      # downgrading the CPU tier, which BLAS ignores.
      # Deliberately does NOT set CERA_REQUIRE_MODEL. It makes *any* absent
      # fixture fatal, but this leg fetches only `core` on a PR while granite /
      # llama3 / qwen2 / qwen3 are `arch`-tier — so it would fail four tests that
      # are supposed to skip. (It is also an all-or-nothing switch: the tests
      # check `env::var(..).is_err()`, so even an empty value trips it.) An
      # absent fixture is already fatal where it matters — `fetch_test_models.sh`
      # exits non-zero if a download fails.
      - name: Parity (native int8 batched path)
        run: |
          cargo test -p cera --release --no-fail-fast \
            --test llama_batched_prefill_parity \
            --test lfm2_batched_prefill_parity \
            --test unbatchable_warning \
            -- --ignored --nocapture

  integration-test:
    name: Integration Tests (gated)
    needs: check
    # Only run on main-branch pushes and manual dispatch. Skipping PR runs
    # keeps PR cycle latency low — these tests download ~210 MB and are
    # meant as a correctness backstop, not per-PR regression guardrail.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Cap at 30 min. PR #58's fixture swap (LFM2-1.2B → 350M-Extract)
    # cut bundle_download from 31s → 11s and bundle_from_id stays sub-
    # second, but `shift_real_model` does ~457 tokens of prefill across
    # 16 attention layers + the post-shift K re-rotation work, which
    # ran ~14 min on the 2-core Ubuntu runner with `ubatch_size:0`
    # before BLAS was wired up here. With `--features blas` + OpenBLAS
    # installed below (this PR's scope), the batched prefill path now
    # routes Q×Kᵀ / AV / FFN matmuls through OpenBLAS's `cblas_sgemm`
    # instead of the per-token scalar fallback x86_64 used to hit. The
    # 30-min cap stays as a safety net while we measure the actual
    # post-merge speedup.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
      - uses: Swatinem/rust-cache@v2
      # OpenBLAS provides cblas_sgemm for the cera `blas` feature
      # (linked via `openblas-src` / `cblas-sys`, see cera/Cargo.toml).
      # On x86_64 this is the actual SGEMM impl behind
      # `try_blas_prefill_gemm` — meaningful only after this PR lifted
      # the `cfg(target_arch = "aarch64")` gate that previously made
      # `--features blas` a no-op on this runner.
      - name: Install OpenBLAS
        run: |
          # Remove every apt source referencing packages.microsoft.com — see the
          # lavapipe job for why (intermittent invalid InRelease breaks update).
          while IFS= read -r f; do
            sudo rm -f -- "$f"
          done < <(grep -Frl packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null || true)
          sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - name: Cache downloaded test models
        uses: actions/cache@v5
        with:
          path: target/tmp/cera-test-models
          # Bump the key suffix to invalidate after model-file changes.
          # `v2`: switched fixture to LFM2-350M-Extract Q4_0 (~210 MB)
          # from LFM2-1.2B Q4_0 (~700 MB) — the 1.2B was timing out the
          # job's 15-minute cap on Ubuntu CPU runners (~13 min runtime
          # for `shift_real_model` alone).
          key: cera-test-models-lfm2-350m-extract-q4_0-v2
      # NOTE: targeted to the download-gated test binaries only.
      # `cargo test -- --ignored` without `--test` would sweep every
      # #[ignore]'d test in the workspace (Metal microbenchmarks,
      # parity tests requiring CERA_TEST_MODEL, etc.), most of which
      # don't belong on an Ubuntu CI runner. `--features remote,blas`:
      # `remote` for the bundle downloader + cache shim, `blas` to
      # route SGEMM through OpenBLAS instead of the scalar fallback.
      # `blas_correctness` is the new oracle that asserts BLAS-on-
      # x86_64 produces tokens identical to the aarch64+blas reference;
      # if it fails on Ubuntu CI but passes on macOS, we have a
      # platform-specific BLAS bug to chase.
      - name: Run gated integration tests
        env:
          CERA_TEST_DOWNLOAD: "1"
        run: |
          cargo test -p cera --features remote,blas \
            --test shift_real_model \
            --test bundle_download \
            --test bundle_from_id \
            --test blas_correctness \
            -- --ignored

  parity-test:
    name: Parity Harness (gated)
    needs: check
    # Same gating shape as `integration-test`: main-branch pushes +
    # manual dispatch only. PR runs would pay a 200 MB cold-cache
    # download for a regression check the FFI unit tests already
    # cover; this job's value lives at the rust↔kotlin boundary that
    # the Kotlin leg (PR 16) exercises. The Swift leg runs in the
    # parallel `parity-test-swift` job below on a macOS runner.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
      - uses: Swatinem/rust-cache@v2
      # JDK 21 (Temurin) for the Kotlin runner. The cera ecosystem
      # baselines on JDK 21 (per the user's global CLAUDE.md note that
      # the SDKMAN current may drift to a newer Java that breaks
      # plugins). Using `setup-java`'s built-in Gradle caching lets the
      # second-and-later runs skip the dependency download.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Cache downloaded parity fixtures
        uses: actions/cache@v5
        with:
          # Distinct from `cera-test-models` so a fixture rotation in
          # one suite doesn't invalidate the other. Bump the key suffix
          # when the bundle id / quant in `cera-parity/tests/parity.rs`
          # changes. The macOS swift parity job uses the same key
          # value but lives in a separate (OS-segregated) cache pool.
          path: target/tmp/cera-parity-cache
          key: cera-parity-cache-lfm2-350m-q4_0-v1
      # The Kotlin leg loads `libcera_ffi.so` through JNA. Build the
      # cdylib first so JNA's `-Djna.library.path` (set on the
      # subprocess via `--lib-dir`) finds something to load.
      # `--release`: the harness below runs in `--release`; loading a
      # debug cdylib here would compare release rust vs debug FFI
      # native code — apples to oranges, and would make the kotlin
      # leg look 5-10× slower than reality.
      - name: Build cera-ffi cdylib (release)
        run: cargo build --release -p cera-ffi
      # Build the Kotlin runner fat jar. `--no-daemon` is the right
      # default for CI (single-shot invocation; daemon adds startup
      # cost and disk usage that doesn't pay off across runs).
      - name: Build kotlin-jna runner
        working-directory: cera-parity/legs/kotlin
        run: ./gradlew --no-daemon shadowJar
      # `cargo run check` does both jobs the integration tests
      # used to do — token equality across legs (rust ↔ ffi ↔
      # kotlin-jna) and per-leg wall-clock with a threshold gate.
      # `--release` matters: a debug build of cera is ~10× slower
      # at LFM2 prefill, which would dominate the timing data and
      # turn the perf table into noise.
      #
      # Threshold: `--max-slowdown 30` is sized from local M-class
      # measurements (kotlin-jna runs 10-12× rust on a warm cache)
      # plus a generous CI margin (cold caches + 2-core x86_64
      # runner hit harder). If post-merge runs show a tighter
      # steady-state, drop the threshold; if real CI variance
      # rides it close, raise it. Per-leg-class thresholds (e.g.
      # 2× for ffi, 30× for subprocess) are out of scope here —
      # tracked as future work in devlog 000062.
      #
      # `--fail-on-slowdown` makes a breach exit non-zero so the
      # gate is load-bearing. The same invocation also gates
      # token equality (exit 1 on divergence) — replaces the old
      # `cargo test --tests --ignored` step.
      # `CERA_PARITY_RUN` is intentionally NOT set here — the
      # `cera-parity check` CLI invocation doesn't read it (that env
      # var only gates the `#[ignore]`'d cargo-test integration
      # tests). Including it would imply the CLI cares about it.
      - name: Run parity harness with perf gate
        run: |
          cargo run --release -p cera-parity -- check \
            --bundle LFM2-350M-Extract-GGUF --quant Q4_0 \
            --prompt "The capital of France is" \
            --max-tokens 16 --seed 0 \
            --kotlin-runner ${{ github.workspace }}/cera-parity/legs/kotlin/build/libs/cera-parity-kotlin-all.jar \
            --lib-dir ${{ github.workspace }}/target/release \
            --max-slowdown 30 \
            --fail-on-slowdown

  parity-test-swift:
    name: Parity Harness Swift (gated)
    needs: check
    # Same gating shape as `parity-test`: main-branch pushes + manual
    # dispatch only. Apple runners are billed at higher per-minute
    # rates, so this gate is doubly worth it on macOS.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # macos-26 = Apple Silicon Tahoe runner image. Swift on macOS is
    # the natural toolchain; Swift on Linux works too but the
    # toolchain weight isn't worth the marginal coverage — the
    # kotlin leg already exercises the FFI surface on Ubuntu.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
      - uses: Swatinem/rust-cache@v2
      - name: Cache downloaded parity fixtures
        uses: actions/cache@v5
        with:
          # Same key as `parity-test`'s ubuntu run; GitHub's cache
          # is OS-segregated so they live in separate pools and the
          # 210 MB fixture downloads at most once per OS per run.
          path: target/tmp/cera-parity-cache
          key: cera-parity-cache-lfm2-350m-q4_0-v1
      # SPM build cache. Keyed on Package.swift + the two binding
      # files (which are git-tracked symlinks but their content
      # hashes change when `just bindings` regenerates upstream).
      # Cold `swift build` takes 10-30s on macos-26; cache hits
      # drop the runner-build step to <1s.
      - name: Cache SPM build artifacts
        uses: actions/cache@v5
        with:
          path: cera-parity/legs/swift/.build
          key: cera-parity-swift-spm-${{ hashFiles('cera-parity/legs/swift/Package.swift', 'cera-ffi/bindings/swift/cera_ffi.swift', 'cera-ffi/bindings/swift/CeraFFI.h') }}
      # The Swift leg links against `libcera_ffi.dylib` at build time.
      # The binary records an absolute install_name pointing at the
      # cdylib's build-time location under `target/release/` in this
      # same checkout, so dyld can find the dylib by that path alone.
      # We also export `DYLD_LIBRARY_PATH` at run time as a robustness
      # measure — dyld checks it before falling through to install_name
      # lookup, so a moved-or-renamed cdylib still resolves as long
      # as a same-basename match exists in the directory passed via
      # the `--lib-dir` flag below (the rust harness translates that
      # to `DYLD_LIBRARY_PATH` on the spawned subprocess).
      # Build the cdylib first so the `swift build -Xlinker -L<dir>`
      # step has something to link against. `--release` matters: the
      # harness below runs in `--release`; loading a debug cdylib
      # would compare release rust vs debug FFI native code (apples
      # to oranges) and inflate the swift slowdown ratio.
      - name: Build cera-ffi cdylib (release)
        run: cargo build --release -p cera-ffi
      # `swift build -c release -Xlinker -L<dir>` produces
      # `.build/release/CeraParitySwift`. `-Xlinker -L<dir>` is the
      # SPM-portable way to add a library search path; `LDFLAGS` is
      # not honored consistently by `swift build`. Linking against
      # `target/release` matches the `cargo build --release -p cera-ffi`
      # output so install_name + runtime DYLD_LIBRARY_PATH agree.
      - name: Build swift-uniffi runner
        working-directory: cera-parity/legs/swift
        run: |
          swift build -c release \
            -Xlinker -L${{ github.workspace }}/target/release
      # `cargo run check --fail-on-slowdown` does token equality
      # AND perf-threshold gating in one pass — same shape as the
      # ubuntu kotlin-jna gate above. See that job's comment for
      # the threshold rationale; same `30×` value applies here
      # because swift-uniffi has shown nearly identical
      # subprocess overhead to kotlin-jna on local M-class runs
      # (10.5×–12× kotlin-jna vs 10.9×–12.3× swift-uniffi at the
      # `cera-parity check` defaults).
      #
      # `CERA_PARITY_RUN` is intentionally NOT set here — the
      # `cera-parity check` CLI invocation doesn't read it (that env
      # var only gates the `#[ignore]`'d cargo-test integration
      # tests).
      - name: Run parity harness with perf gate
        run: |
          cargo run --release -p cera-parity -- check \
            --bundle LFM2-350M-Extract-GGUF --quant Q4_0 \
            --prompt "The capital of France is" \
            --max-tokens 16 --seed 0 \
            --swift-runner ${{ github.workspace }}/cera-parity/legs/swift/.build/release/CeraParitySwift \
            --lib-dir ${{ github.workspace }}/target/release \
            --max-slowdown 30 \
            --fail-on-slowdown

name: Publish

# Consolidated release pipeline — crates.io, CLI binaries, npm (cera-wasm), and
# Maven Central (cera-ffi Kotlin), plus the canonical `v<version>` git tag +
# GitHub release. Replaces the former per-target workflows (publish-crates.yml,
# publish-cli.yml, publish-npm.yml, publish-jvm.yml).
#
# A single workflow_dispatch with a global `dry_run` and per-target toggles, so
# you can release any subset. `<version>` is read once from the `cera` crate.
#
# Idempotent: every leg skips work that's already done — crates already on the
# index, npm versions already published, the Maven coordinate already released
# on Central, and the GitHub release (updated in place). So if a leg fails on a
# transient error, just re-run the workflow (or "Re-run failed jobs"): completed
# parts are skipped and only the failed parts retry. Publishes also retry
# transient failures in-line before giving up.
#
# All artifacts release under ONE version (read from the `cera` crate) — the
# `version` job runs `bump-version.sh --check` first, so a drifted crate pin or
# Gradle coordinate fails the release before anything is uploaded.
#
#   dry_run = true  (default): every enabled leg validates/packages only — no
#                              uploads, no tag.
#   dry_run = false:           enabled legs publish for real, then the `release`
#                              job cuts the `v<version>` tag + GitHub release
#                              ONCE (after the enabled publishes succeed).
#
# Secrets (only needed for a real, non-dry-run upload of that leg):
#   CARGO_REGISTRY_TOKEN                    — crates.io
#   NPM_TOKEN                               — npm (@hyeons-lab scope)
#   MAVEN_CENTRAL_USERNAME / _PASSWORD      — Maven Central (Central Portal token)
#   MAVEN_SIGNING_KEY / MAVEN_SIGNING_PASSWORD — ASCII-armored GPG private key +
#       its passphrase, used to sign the Maven release artifacts (required by
#       Central for non-SNAPSHOT releases). The dry run publishes a SNAPSHOT
#       locally and needs neither.
# The tag + GitHub release uses the default GITHUB_TOKEN.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate/package only — no uploads, no tag)'
        type: boolean
        required: true
        default: true
      crates:
        description: 'crates.io (cera, cera-ffi, cera-cli, cera-wasm)'
        type: boolean
        default: true
      cli:
        description: 'Build CLI binaries (attached to the release; the tag/release itself is cut whenever any leg runs)'
        type: boolean
        default: true
      npm:
        description: 'npm (cera-wasm)'
        type: boolean
        default: true
      jvm:
        description: 'Maven Central (cera-ffi Kotlin)'
        type: boolean
        default: true
      spm:
        description: 'Swift Package Manager (CeraFFI.xcframework — rewrites Package.swift + retags on real runs)'
        type: boolean
        default: true
      web:
        description: 'Web runtime for the Flutter plugin (cera-wasm --target web --features wgpu, attached to the release)'
        type: boolean
        default: true
      pub:
        description: 'pub.dev (cera_ffi & cera_ffi_flutter)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Override .cargo/config.toml's `target-cpu=native` (see its header) — on CI
  # runners "native" degrades to a feature-stripped baseline that trips
  # `ring`'s aarch64-apple-darwin const assertion, and a release binary must run
  # on any CPU of its arch anyway. Empty RUSTFLAGS forces the generic baseline.
  # Mirrors ci.yml; the two wasm jobs override it at job level (see below).
  RUSTFLAGS: ""
  # NOTE: that empty value REPLACES `.cargo/config.toml` for every target
  # rather than appending to it, which also deletes the wasm32 entry's
  # `+simd128`. Both wasm jobs below set RUSTFLAGS back at job level. This one
  # shipped: the published `@hyeons-lab/cera-wasm` was built on the scalar
  # path.

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
      # Gate the whole release on version consistency: every crate, the Dart
      # pubspec, and the Gradle VERSION_NAME must match the VERSION file. This
      # runs before anything publishes, so a drifted pin/coordinate can't ship.
      - name: Version drift check
        run: ./scripts/bump-version.sh --check
      - name: Read version from `cera`
        id: version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "cera") | .version')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Could not determine cera version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "cera version: $VERSION"

  # ── crates.io ──────────────────────────────────────────────────────────────
  publish-crates:
    name: Publish crates to crates.io
    needs: version
    if: ${{ github.event.inputs.crates == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10

      - uses: Swatinem/rust-cache@v2

      # Compile-verify the whole workspace with local path deps before any
      # packaging. The dry-run packaging below uses --no-verify for downstream
      # crates (their `cera` dep isn't on the index yet), so this is what
      # actually guarantees every crate still builds.
      - name: Verify workspace compiles
        run: cargo check --workspace

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # Topological order: `cera` (no internal deps) first, then the three
          # crates that depend only on `cera`. `cera-parity` is publish=false
          # (internal cross-language parity harness) and is excluded.

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "=== DRY RUN: packaging only, no upload ==="
            cargo package -p cera
            # Downstream crates depend on `cera = "0.1.x"`, which is not on the
            # index during a dry run — point the dep back at the local path and
            # skip the verify build's registry resolution.
            for c in cera-ffi cera-cli cera-wasm; do
              echo "--- packaging $c ---"
              cargo package -p "$c" --no-verify \
                --config "patch.crates-io.cera.path='cera'"
            done
            echo "All crates packaged successfully (dry run)."
            exit 0
          fi

          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not set. Configure CARGO_REGISTRY_TOKEN in repository secrets or uncheck crates when dispatching." >&2
            exit 1
          fi

          echo "=== PUBLISHING TO crates.io ==="

          crate_version() {
            cargo metadata --no-deps --format-version 1 \
              | jq -r --arg n "$1" '.packages[] | select(.name == $n) | .version'
          }

          # Sparse-index path prefix for a crate name (cargo's own scheme).
          index_prefix() {
            local n="$1"
            case "${#n}" in
              1) printf '1' ;;
              2) printf '2' ;;
              3) printf '3/%s' "${n:0:1}" ;;
              *) printf '%s/%s' "${n:0:2}" "${n:2:2}" ;;
            esac
          }

          # True once <version> appears in the SPARSE INDEX (index.crates.io) —
          # this, not the web API, is what the next `cargo publish` resolves the
          # `cera` dep against. The API returns 200 almost immediately, but the
          # index can lag, so a dependent publish would otherwise fail.
          index_has() {
            curl -sS --connect-timeout 10 --max-time 20 "https://index.crates.io/$(index_prefix "$1")/$1" 2>/dev/null \
              | grep -q "\"vers\":\"$2\""
          }

          # Idempotent per-crate publish: skip if already on the index (so a
          # rerun retries only the missing crates), retry transient failures,
          # and re-check after an error in case the upload actually landed.
          publish_one() {
            local crate="$1" ver
            ver=$(crate_version "$crate")
            if index_has "$crate" "$ver"; then
              echo "✓ ${crate}@${ver} already on the crates.io index — skipping"
              return 0
            fi
            local attempt=1 max=3 out
            while :; do
              echo "Publishing ${crate}@${ver} (attempt ${attempt}/${max})..."
              if out=$(cargo publish -p "$crate" 2>&1); then
                echo "$out"
                break
              fi
              echo "$out"
              # "already exists on crates.io index" is cargo's verbatim message
              # when this version is already published — a definitive skip, not a
              # transient error. Confirm against the sparse index too.
              if grep -q "already exists on crates.io" <<<"$out" || index_has "$crate" "$ver"; then
                echo "  ${crate}@${ver} already on the index — treating as published"
                break
              fi
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::${crate}@${ver} failed to publish after ${max} attempts" >&2
                return 1
              fi
              attempt=$((attempt + 1))
              echo "  transient failure — retrying in 15s..."
              sleep 15
            done
            # Wait for the SPARSE INDEX to carry this version so the next crate's
            # `cera` dep resolves (the web API lands sooner than the index).
            for i in $(seq 1 20); do
              if index_has "$crate" "$ver"; then
                echo "  ${crate}@${ver} visible in sparse index"
                return 0
              fi
              echo "  waiting for index propagation (${i}/20)..."
              sleep 15
            done
            echo "::warning::${crate}@${ver} not in sparse index after wait"
            return 0
          }

          for c in cera cera-ffi cera-cli cera-wasm; do
            publish_one "$c" || exit 1
          done
          echo "All crates published (or already present)."

  # ── CLI binaries ───────────────────────────────────────────────────────────
  build-cli:
    name: Build cera CLI (${{ matrix.name }})
    needs: version
    if: ${{ github.event.inputs.cli == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon: ship the batteries-included binary — Accelerate
          # (AMX) for CPU prefill + the Metal GPU backend, both system-provided.
          - os: macos-latest
            name: macos-arm64
            features: '--features blas,metal'
            archive: tar
          - os: ubuntu-latest
            name: linux-x86_64
            features: ''
            archive: tar
          - os: windows-latest
            name: windows-x86_64
            features: ''
            archive: zip
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10

      - uses: Swatinem/rust-cache@v2

      - name: Build cera
        run: cargo build --release -p cera-cli --bin cera ${{ matrix.features }}

      - name: Package (tar.gz)
        if: ${{ matrix.archive == 'tar' }}
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tar -czf "cera-${{ matrix.name }}-v${VERSION}.tar.gz" -C target/release cera

      - name: Package (zip)
        if: ${{ matrix.archive == 'zip' }}
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          Compress-Archive -Path target/release/cera.exe `
            -DestinationPath "cera-${{ matrix.name }}-v$version.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.name }}
          path: cera-${{ matrix.name }}-v${{ needs.version.outputs.version }}.*
          if-no-files-found: error

  # ── npm (cera-wasm) ────────────────────────────────────────────────────────
  publish-npm:
    name: Publish cera-wasm to npm
    needs: version
    if: ${{ github.event.inputs.npm == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Puts back `.cargo/config.toml`'s wasm32 entry, which the workflow-level
    # `RUSTFLAGS: ""` replaces. This is the job whose output people install
    # from npm.
    env:
      RUSTFLAGS: "-C target-feature=+simd128"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # Composite action, so no Node runtime to deprecate; see the note in
      # ci.yml. Same pinned wasm-pack version.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0

      - uses: ./.github/actions/install-binaryen

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Publish the `bundler` target as the canonical `@hyeons-lab/cera-wasm`
      # (the most common consumer shape). The `web` / `nodejs` shapes share the
      # same package name today; publishing them as distinct npm packages is a
      # follow-up (would require rewriting package.json.name per target).
      - name: Build cera-wasm npm package (bundler)
        run: |
          wasm-pack build cera-wasm \
            --target bundler \
            --release \
            --scope hyeons-lab \
            --out-dir pkg-bundler

      - name: Assert the build has SIMD in it
        # Before publishing, not after: this is the artifact people install,
        # and it went out on the scalar path once already.
        run: scripts/assert-wasm-simd.sh "cera-wasm/pkg-bundler/cera_wasm_bg.wasm"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          pkg_dir=cera-wasm/pkg-bundler
          name=$(node -p "require('./$pkg_dir/package.json').name")
          version=$(node -p "require('./$pkg_dir/package.json').version")

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "=== DRY RUN: npm publish --dry-run (${name}@${version}) ==="
            # Leading `./` so npm reads this as a local dir, not a `user/repo`
            # GitHub shorthand (which it would try to `git ls-remote`).
            npm publish "./$pkg_dir" --access public --dry-run
            exit 0
          fi

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is not set. Configure NPM_TOKEN in repository secrets or uncheck npm when dispatching." >&2
            exit 1
          fi

          # Idempotent: npm rejects republishing an existing version, so skip if
          # it's already up: a rerun then only retries what's missing.
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "✓ ${name}@${version} already on npm — skipping"
            exit 0
          fi
          echo "Publishing ${name}@${version} to npm..."
          # Leading `./` so npm reads this as a local dir, not a `user/repo`
          # GitHub shorthand (which it would try to `git ls-remote`).
          npm publish "./$pkg_dir" --access public

  # ── Maven Central (cera-ffi Kotlin) ────────────────────────────────────────
  jvm-native-libs:
    name: JVM native libs (${{ matrix.label }})
    needs: version
    if: ${{ github.event.inputs.jvm == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Desktop JVM targets → JNA resource-prefix dirs under the jvm module.
          # The prefix names are JNA's, derived from os.name/os.arch at runtime:
          # a consumer on a platform with no dir here finds no bundled library
          # and fails the load.
          - { os: macos-latest,   label: darwin-aarch64, target: aarch64-apple-darwin,    lib: libcera_ffi.dylib, dest: cera-ffi-kotlin/cera-ffi-jvm/src/main/resources/darwin-aarch64, android: false }
          # Intel Macs. Cross-compiled from the arm64 runner; the Apple SDK is
          # universal so this needs only `rustup target add`.
          - { os: macos-latest,   label: darwin-x86-64,  target: x86_64-apple-darwin,     lib: libcera_ffi.dylib, dest: cera-ffi-kotlin/cera-ffi-jvm/src/main/resources/darwin-x86-64,  android: false }
          - { os: ubuntu-latest,  label: linux-x86-64,   target: x86_64-unknown-linux-gnu, lib: libcera_ffi.so,    dest: cera-ffi-kotlin/cera-ffi-jvm/src/main/resources/linux-x86-64,  android: true  }
          - { os: windows-latest, label: win32-x86-64,   target: x86_64-pc-windows-msvc,  lib: cera_ffi.dll,      dest: cera-ffi-kotlin/cera-ffi-jvm/src/main/resources/win32-x86-64,  android: false }
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build desktop cdylib
        shell: bash
        run: |
          # `--features ffi-buffer`: this cdylib is both the JVM bindings'
          # JNA resource and the Flutter plugin's Linux/Windows/macOS
          # download. Dart calls only the trampolines it enables.
          cargo build -p cera-ffi --release --target ${{ matrix.target }} --features ffi-buffer
          scripts/assert-ffibuffer.sh "target/${{ matrix.target }}/release/${{ matrix.lib }}"
          mkdir -p "${{ matrix.dest }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.lib }}" "${{ matrix.dest }}/${{ matrix.lib }}"
          # Marker at the module root so upload-artifact's lowest-common-ancestor
          # is always `cera-ffi-kotlin/`, regardless of which subtrees a given
          # runner populated (macOS/Windows stage only resources/, no jniLibs).
          # Without it the LCA collapses to resources/ and the download lands the
          # libs at the wrong paths. Paired with `path: cera-ffi-kotlin` on download.
          touch cera-ffi-kotlin/CI_ARTIFACT_ROOT

      # Android .so for all four ABIs — built once, on the Linux runner.
      - name: Set up Android NDK
        if: ${{ matrix.android }}
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
      - name: Build Android jniLibs
        if: ${{ matrix.android }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          cargo install cargo-ndk --version '^4' --locked
          # `--features ffi-buffer` is required even though Kotlin never calls
          # the trampolines: the same AAR backs the Flutter plugin, and its
          # Dart bindings call nothing else.
          cargo ndk -o cera-ffi-kotlin/cera-ffi-android/src/main/jniLibs \
            --target arm64-v8a --target armeabi-v7a --target x86_64 --target x86 \
            build -p cera-ffi --release --features ffi-buffer
          scripts/assert-ffibuffer.sh \
            cera-ffi-kotlin/cera-ffi-android/src/main/jniLibs/*/libcera_ffi.so

      - name: Upload staged native libs
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.label }}
          path: |
            cera-ffi-kotlin/CI_ARTIFACT_ROOT
            cera-ffi-kotlin/cera-ffi-jvm/src/main/resources/
            cera-ffi-kotlin/cera-ffi-android/src/main/jniLibs/
          if-no-files-found: error
          include-hidden-files: false

      # The same cdylib, packaged as a standalone release asset. Until this
      # existed the desktop libraries shipped ONLY inside the Maven jar, which
      # left non-JVM desktop consumers — the Flutter plugin's Linux and Windows
      # CMake steps in particular — with nothing to download. Reuses the
      # artifact already built above rather than adding a build matrix.
      #
      # `.sha256` accompanies each archive so a consumer can verify the
      # download; the CMake and podspec fetch steps do exactly that.
      - name: Package standalone cdylib
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p desktop-libs
          archive="cera-ffi-${{ matrix.label }}-v${VERSION}.tar.gz"
          tar -czf "desktop-libs/${archive}" \
            -C "target/${{ matrix.target }}/release" "${{ matrix.lib }}"
          # Use sha256sum when available (Linux / Windows Git-Bash), falling back to shasum (macOS).
          if command -v sha256sum >/dev/null 2>&1; then
            ( cd desktop-libs && sha256sum "${archive}" > "${archive}.sha256" )
          else
            ( cd desktop-libs && shasum -a 256 "${archive}" > "${archive}.sha256" )
          fi
          cat "desktop-libs/${archive}.sha256"

      - name: Upload standalone cdylib
        uses: actions/upload-artifact@v7
        with:
          name: desktop-lib-${{ matrix.label }}
          path: desktop-libs/
          if-no-files-found: error

  publish-jvm:
    name: Assemble & publish to Maven Central
    needs: [version, jvm-native-libs]
    if: ${{ github.event.inputs.jvm == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Pull every runner's native libs back into the module source trees. The
      # committed `cera_ffi.kt` binding is already in the repo (srcDir'd by both
      # modules), so no Rust build is needed here.
      # The artifacts are rooted at `cera-ffi-kotlin/` (see the CI_ARTIFACT_ROOT
      # marker on upload), so extract there to land each lib at its real path.
      - name: Download native libs
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: cera-ffi-kotlin

      - name: Show staged native libs
        run: |
          find cera-ffi-kotlin -path '*/resources/*/*' -o -path '*/jniLibs/*/*' | sort

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Publish
        working-directory: cera-ffi-kotlin
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          # GPG signing — required for a real (non-SNAPSHOT) Maven Central
          # release; signAllPublications() is on whenever the version isn't a
          # SNAPSHOT. Unused by the dry run (which publishes a SNAPSHOT locally).
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            # Validate assembly + packaging only. A `-SNAPSHOT` coordinate keeps
            # signing off, so the dry run needs no GPG key (matching the
            # secret-free dry runs of the crates/npm legs).
            echo "=== DRY RUN: publishToMavenLocal cera-ffi ${VERSION}-SNAPSHOT (no upload) ==="
            ./gradlew publishToMavenLocal -PVERSION_NAME="${VERSION}-SNAPSHOT" \
              --no-daemon --stacktrace
            exit 0
          fi

          if [ -z "${ORG_GRADLE_PROJECT_mavenCentralUsername:-}" ] || [ -z "${ORG_GRADLE_PROJECT_mavenCentralPassword:-}" ]; then
            echo "::error::Maven Central credentials (MAVEN_CENTRAL_USERNAME/PASSWORD) are not set. Configure them in repository secrets or uncheck jvm when dispatching." >&2
            exit 1
          fi

          if [ -z "${ORG_GRADLE_PROJECT_signingInMemoryKey:-}" ] || [ -z "${ORG_GRADLE_PROJECT_signingInMemoryKeyPassword:-}" ]; then
            echo "::error::GPG signing keys (MAVEN_SIGNING_KEY/PASSWORD) are not set. Configure them in repository secrets to sign non-SNAPSHOT Maven Central releases." >&2
            exit 1
          fi

          # Idempotent: unlike a snapshot, a released version cannot be
          # re-published to Maven Central, so skip if the coordinate is already
          # live. The JVM module's POM stands in for the whole deployment (both
          # modules release together under the same version). NOTE: Maven Central
          # -> repo1 sync can lag minutes after a release, so an immediate rerun
          # may not yet see it; wait before re-dispatching the jvm leg.
          pom_url="https://repo1.maven.org/maven2/com/hyeons-lab/cera-ffi-jvm/${VERSION}/cera-ffi-jvm-${VERSION}.pom"
          code=$(curl -sS --connect-timeout 10 --max-time 20 -o /dev/null -w '%{http_code}' "$pom_url" 2>/dev/null || echo 000)
          if [ "$code" = "200" ]; then
            echo "✓ cera-ffi ${VERSION} already on Maven Central — skipping"
            exit 0
          fi

          # Real release: publishAndReleaseToMavenCentral signs (release version
          # triggers signAllPublications) and auto-releases the deployment, so
          # the artifacts go live without a manual Portal step. VERSION_NAME is
          # pinned to the cera crate version so the Maven coordinate matches the
          # git tag + crates.io + npm exactly.
          echo "=== Publishing cera-ffi ${VERSION} to Maven Central ==="
          ./gradlew publishAndReleaseToMavenCentral -PVERSION_NAME="${VERSION}" \
            --no-daemon --stacktrace

  # ── Swift Package Manager (CeraFFI.xcframework) ────────────────────────────
  build-spm:
    name: Build SwiftPM XCFramework
    needs: version
    if: ${{ github.event.inputs.spm == 'true' }}
    # Apple Silicon runner — the XCFramework is arm64-only; `xcodebuild
    # -create-xcframework` + `swift package compute-checksum` must run on an
    # arm64 host (mirrors the ci.yml apple-xcframework job's macos-15 pin).
    runs-on: macos-15
    timeout-minutes: 40
    outputs:
      checksum: ${{ steps.zip.outputs.checksum }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Assert arm64 host
        run: |
          set -euo pipefail
          ARCH=$(uname -m)
          if [ "$ARCH" != "arm64" ]; then
            echo "::error::expected arm64 host for arm64-only xcframework, got '$ARCH'" >&2
            exit 1
          fi
      - uses: extractions/setup-just@v4
      - name: Build CeraFFI.xcframework
        # Calls the recipe rather than restating it. This step used to inline a
        # copy "mirroring" `just apple-xcframework`, and the copy silently went
        # stale: the recipe moved to DYNAMIC frameworks and added the
        # `ffi-buffer` feature, while CI kept building static `-library` slices
        # without it. A release cut from here would have undone both.
        run: just apple-xcframework
      - name: Zip + compute-checksum
        id: zip
        run: |
          set -euo pipefail
          ( cd target/xcframework-build && zip -r CeraFFI.xcframework.zip CeraFFI.xcframework >/dev/null )
          # Run compute-checksum from the repo root (the root Package.swift makes
          # this a valid package context). The checksum is over the EXACT zip we
          # upload, and the release job bakes this same value into Package.swift,
          # so the pair is internally consistent regardless of zip determinism.
          CS=$(swift package compute-checksum target/xcframework-build/CeraFFI.xcframework.zip)
          echo "checksum=$CS" >> "$GITHUB_OUTPUT"
          echo "CeraFFI.xcframework.zip checksum: $CS"
      - uses: actions/upload-artifact@v7
        with:
          name: spm-xcframework
          path: target/xcframework-build/CeraFFI.xcframework.zip
          if-no-files-found: error

  # ── Web runtime (Flutter plugin's browser backend) ─────────────────────────
  build-web-assets:
    # The two files `dart run cera_ffi:install_web` fetches. They are the web's
    # equivalent of the per-platform native libraries every other target
    # downloads: a build output, so never committed and never in the pub
    # archive, which leaves a release asset as the only place for them.
    #
    # Built with `--features wgpu` and NOT with the npm leg's `bundler` target.
    # Both differences matter. `--target web` is the shape a plain
    # `import('./cera_wasm.js')` can load, which is what the worker does; the
    # bundler target expects a bundler to resolve its wasm import and fails in a
    # bare browser. And the `wgpu` feature is what carries `WebGpuSession`,
    # without which the browser falls back to the wasm CPU path at ~1/40th the
    # throughput, silently, since the fallback is by design.
    #
    # One artifact serves both backends: cargo features are additive, so this
    # build has the CPU `CeraEngine` too, and the worker picks at runtime.
    name: Build web runtime
    needs: version
    if: ${{ github.event.inputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Puts back `.cargo/config.toml`'s wasm32 entry, which the workflow-level
    # `RUSTFLAGS: ""` replaces. `just wasm-web-wgpu` sets no RUSTFLAGS of its
    # own, so without this the released web runtime, and every Flutter web app
    # that installs it, runs scalar kernels on the CPU fallback path.
    env:
      RUSTFLAGS: "-C target-feature=+simd128"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # Composite action, so no Node runtime to deprecate; see the note in
      # ci.yml. Same pinned wasm-pack version.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0

      - uses: ./.github/actions/install-binaryen

      # ubuntu-latest ships no `just`, and the next step is the only thing in
      # this job that runs a recipe. Without this the web leg of a release fails
      # at "Build cera-wasm", which takes the `release` job down with it.
      - uses: extractions/setup-just@v4

      - name: Build cera-wasm (web target, wgpu)
        run: just wasm-web-wgpu

      - name: Assert the build has SIMD in it
        # Alongside the wgpu check below: that one guards the GPU path, this
        # one guards the CPU fallback the same artifact serves. `just
        # wasm-web-wgpu` runs the same assert on the same file, so this step
        # is redundant while the recipe keeps it; kept anyway so the release
        # leg's coverage does not depend on a recipe it does not own.
        run: scripts/assert-wasm-simd.sh "cera-wasm/examples/webgpu/pkg/cera_wasm_bg.wasm"

      - name: Stage release assets
        # Renamed on the way out and renamed back by `install_web`. The local
        # names are not free choices (wasm-bindgen's loader resolves its
        # sibling as `new URL('cera_wasm_bg.wasm', import.meta.url)`), but a
        # release's asset namespace is flat and shared with every other target,
        # so `cera_wasm.js` is too generic to claim there.
        run: |
          set -euo pipefail
          mkdir -p release-assets
          src=cera-wasm/examples/webgpu/pkg
          cp "$src/cera_wasm.js"     release-assets/cera-wasm-web.js
          cp "$src/cera_wasm_bg.wasm" release-assets/cera-wasm-web_bg.wasm
          ls -lh release-assets/

      - name: Verify the wgpu feature is actually in the build
        # A `--features wgpu` that silently did not apply produces a working
        # artifact that is 40x slower, and nothing downstream would report it:
        # the worker treats a missing `WebGpuSession` as "no GPU here" and falls
        # back, which is exactly what it should do when the browser has no
        # WebGPU. The export's presence is the only thing separating those two.
        run: |
          set -euo pipefail
          grep -q 'WebGpuSession' cera-wasm/examples/webgpu/pkg/cera_wasm.js
          grep -q 'generateTokens' cera-wasm/examples/webgpu/pkg/cera_wasm.js
          echo "✓ WebGpuSession + generateTokens exported"

      - uses: actions/upload-artifact@v7
        with:
          name: web-assets
          path: release-assets/
          if-no-files-found: error

  # ── pub.dev package validation (cera_ffi & cera_ffi_flutter) ───────────────
  publish-pub:
    name: Validate pub.dev packages
    needs: [version, build-spm]
    if: >-
      ${{ !cancelled()
          && github.event.inputs.pub == 'true'
          && needs.version.result == 'success'
          && needs.build-spm.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate cera_ffi (Dart package)
        run: |
          set -euo pipefail
          echo "=== Validating cera_ffi package structure ==="
          ( cd cera_ffi && dart pub publish --dry-run )

      - name: Validate cera_ffi_flutter (Flutter plugin)
        run: |
          set -euo pipefail
          echo "=== Validating cera_ffi_flutter package structure ==="
          ( cd cera_ffi_flutter && flutter analyze )
          out=$( ( cd cera_ffi_flutter && flutter pub publish --dry-run 2>&1 ) || true )
          echo "$out"
          if grep -q "Package has 0 warnings" <<<"$out" || grep -q "Package has 1 warning" <<<"$out" || grep -q "Package validation found the following potential issue" <<<"$out"; then
            echo "✓ cera_ffi_flutter package structure verified."
          else
            echo "::error::cera_ffi_flutter dry-run failed with unexpected packaging error" >&2
            exit 1
          fi
          echo "Notice: pub.dev automated publishing strictly requires a Git tag push event (on: push: tags:)."
          echo "cera_ffi and cera_ffi_flutter will be published via publish-pub.yml when the release tag is pushed."

  # ── Tag + GitHub release (the canonical release event) ─────────────────────
  release:
    name: Tag & GitHub Release
    needs: [version, publish-crates, build-cli, publish-npm, jvm-native-libs, publish-jvm, build-spm, build-web-assets, publish-pub]
    # Real runs only, and only once every enabled leg succeeded. Disabled legs
    # are `skipped` (not `failure`), so they don't block the tag; any actual
    # failure does. `jvm-native-libs` is gated too: if it fails, `publish-jvm`
    # is merely `skipped`, which would otherwise slip past the check below.
    # `!cancelled()` lets this run despite skipped needs. The final clause
    # requires at least one leg to be enabled, so an all-toggles-off dispatch
    # can't cut an empty tag/release.
    if: >-
      ${{ !cancelled()
          && github.event.inputs.dry_run == 'false'
          && needs.version.result == 'success'
          && needs.publish-crates.result != 'failure'
          && needs.build-cli.result != 'failure'
          && needs.publish-npm.result != 'failure'
          && needs.jvm-native-libs.result != 'failure'
          && needs.publish-jvm.result != 'failure'
          && needs.build-spm.result != 'failure'
          && needs.build-web-assets.result != 'failure'
          && needs.publish-pub.result != 'failure'
          && (github.event.inputs.crates == 'true'
              || github.event.inputs.cli == 'true'
              || github.event.inputs.npm == 'true'
              || github.event.inputs.jvm == 'true'
              || github.event.inputs.spm == 'true'
              || github.event.inputs.web == 'true'
              || github.event.inputs.pub == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Least privilege: only this job creates the tag / release.
    permissions:
      contents: write
    steps:
      # Working tree — needed only for the SPM leg (Package.swift rewrite +
      # tag move). Checkout FIRST: actions/checkout cleans the workspace, so
      # the artifact downloads below (which land in release-assets/) must come
      # after it or they'd be wiped.
      #
      # Branch protection: the default branch's ruleset forbids direct pushes
      # (bypass_actors: []), so the SPM pin is NEVER pushed to it. The pin step
      # commits the checksum-rewritten Package.swift locally and points the
      # v<version> TAG at that commit (tags aren't covered by the branch
      # ruleset). Consumers resolve the tag; the default branch keeps the
      # placeholder Package.swift. Uses GITHUB_TOKEN (needs `contents: write`,
      # set on this job) for the tag push only.
      - name: Checkout default branch
        if: ${{ needs.build-spm.result == 'success' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true

      # CLI binaries to attach — present only when the `cli` leg ran.
      - name: Download CLI artifacts
        if: ${{ needs.build-cli.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      # Standalone desktop cdylibs to attach — present only when the
      # `jvm-native-libs` leg ran. These are what the Flutter plugin's Linux and
      # Windows CMake steps download; without them those platforms have no
      # native library to fetch.
      - name: Download desktop cdylib artifacts
        if: ${{ needs.jvm-native-libs.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-lib-*
          merge-multiple: true
          path: release-assets

      # Web runtime to attach, present only when the `web` leg ran. This is
      # what `dart run cera_ffi:install_web` downloads; without it the Flutter
      # plugin's web backend has no runtime to install and the tool tells the
      # user to build it locally instead.
      - name: Download web runtime
        if: ${{ needs.build-web-assets.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: web-assets
          path: release-assets

      # SPM XCFramework zip to attach — present only when the `spm` leg ran.
      - name: Download SPM XCFramework
        if: ${{ needs.build-spm.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: spm-xcframework
          path: release-assets

      # Pin the root Package.swift to this release's XCFramework (real URL +
      # checksum) in a LOCAL commit and point the v<version> tag at it — the pin
      # is never pushed to the default branch (its ruleset forbids direct
      # pushes); only the tag is pushed. `.package(url:, from:)` resolves the
      # tag, whose Package.swift checksum matches the attached zip. Idempotent:
      # a rerun re-pins a fresh commit and force-moves the tag.
      - name: Pin Package.swift + tag (SPM)
        if: ${{ needs.build-spm.result == 'success' }}
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CHECKSUM: ${{ needs.build-spm.outputs.checksum }}
        run: |
          set -euo pipefail
          # Rewrite handles BOTH the first-release placeholders and a rerun
          # where real values were already substituted (all four subs are
          # idempotent).
          sed -i.bak \
            -e "s|releases/download/vRELEASE_VERSION/|releases/download/v${VERSION}/|" \
            -e "s|releases/download/v[0-9][0-9A-Za-z.+-]*/CeraFFI\.xcframework\.zip|releases/download/v${VERSION}/CeraFFI.xcframework.zip|" \
            -e "s|checksum: \"RELEASE_CHECKSUM\"|checksum: \"${CHECKSUM}\"|" \
            -e "s|checksum: \"[0-9a-f]\{64\}\"|checksum: \"${CHECKSUM}\"|" \
            Package.swift
          rm -f Package.swift.bak
          # Fail loud if a placeholder survived in the ACTUAL url/checksum
          # values. Match only the placeholder USAGE (`download/vRELEASE_VERSION/`
          # and `checksum: "RELEASE_CHECKSUM"`), NOT the doc comment above that
          # names the tokens in backticks — a bare `RELEASE_VERSION` match there
          # would false-positive even after a correct rewrite.
          if grep -qE 'download/vRELEASE_VERSION/|checksum: "RELEASE_CHECKSUM"' Package.swift; then
            echo "::error::Package.swift still has placeholders after rewrite" >&2
            exit 1
          fi
          grep -q "download/v${VERSION}/CeraFFI.xcframework.zip" Package.swift
          grep -q "checksum: \"${CHECKSUM}\"" Package.swift

          # The Flutter plugin's Apple integrations carry the same two
          # placeholders and consume the same XCFramework: two podspecs (for
          # apps still on CocoaPods) and two SPM manifests (for apps that have
          # migrated). `swift package compute-checksum` is a plain sha256 of the
          # zip, so CHECKSUM is valid for all of them. Same idempotent-rewrite
          # property as above: reruns re-substitute cleanly.
          for f in \
            cera_ffi_flutter/ios/cera_ffi_flutter.podspec \
            cera_ffi_flutter/macos/cera_ffi_flutter.podspec \
            cera_ffi_flutter/ios/cera_ffi_flutter/Package.swift \
            cera_ffi_flutter/macos/cera_ffi_flutter/Package.swift
          do
            sed -i.bak \
              -e "s|releases/download/vRELEASE_VERSION/|releases/download/v${VERSION}/|" \
              -e "s|releases/download/v[0-9][0-9A-Za-z.+-]*/CeraFFI\.xcframework\.zip|releases/download/v${VERSION}/CeraFFI.xcframework.zip|" \
              -e "s|VERSION=\"RELEASE_VERSION\"|VERSION=\"${VERSION}\"|" \
              -e "s|VERSION=\"[0-9][0-9A-Za-z.+-]*\"|VERSION=\"${VERSION}\"|" \
              -e "s|EXPECTED_SHA=\"RELEASE_CHECKSUM\"|EXPECTED_SHA=\"${CHECKSUM}\"|" \
              -e "s|EXPECTED_SHA=\"[0-9a-f]\{64\}\"|EXPECTED_SHA=\"${CHECKSUM}\"|" \
              -e "s|checksum: \"RELEASE_CHECKSUM\"|checksum: \"${CHECKSUM}\"|" \
              -e "s|checksum: \"[0-9a-f]\{64\}\"|checksum: \"${CHECKSUM}\"|" \
              "$f"
            rm -f "$f.bak"
            # Match only placeholder USAGE, never the doc comments that name
            # the tokens in prose — a bare RELEASE_VERSION match there would
            # false-positive even after a correct rewrite.
            if grep -qE 'download/vRELEASE_VERSION/|checksum: "RELEASE_CHECKSUM"|VERSION="RELEASE_VERSION"|EXPECTED_SHA="RELEASE_CHECKSUM"' "$f"; then
              echo "::error::$f still has placeholders after rewrite" >&2
              exit 1
            fi
            if ! grep -q "${CHECKSUM}" "$f"; then
              echo "::error::$f does not contain expected checksum ${CHECKSUM}" >&2
              exit 1
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The default branch is protected by a ruleset (bypass_actors: [], so
          # even GITHUB_TOKEN can't push to it) — do NOT push the pin there.
          # Instead create the checksum-pinned commit locally (parent = the
          # merged release commit) and point the v<version> tag at it.
          # `.package(url:, from:)` resolves the TAG, which carries the correct
          # Package.swift + checksum; the default branch keeps the placeholder
          # form (only a `branch: "main"` SPM dep would see it, which isn't the
          # documented path). Tags are NOT covered by the branch ruleset, so the
          # (force-)tag push is allowed. The sed always turns placeholders into
          # real values, so there is always something to commit.
          # Package.swift plus the Flutter plugin's four Apple integrations,
          # which carry the same placeholders and are pinned by the same sed
          # above. They must ride the SAME tagged commit: pub.dev publishes the
          # plugin from this tag, so a podspec or SPM manifest left on
          # placeholders would ship a package that cannot resolve its native
          # library.
          git add Package.swift \
            cera_ffi_flutter/ios/cera_ffi_flutter.podspec \
            cera_ffi_flutter/macos/cera_ffi_flutter.podspec \
            cera_ffi_flutter/ios/cera_ffi_flutter/Package.swift \
            cera_ffi_flutter/macos/cera_ffi_flutter/Package.swift
          # Normally main carries placeholders so there is always a diff; guard
          # the anomalous no-diff case (main already pinned) so `set -e` + an
          # empty `git commit` can't abort the release — just tag current HEAD.
          if git diff --cached --quiet; then
            echo "CeraFFI.xcframework already pinned for v${VERSION} — tagging current HEAD"
          else
            git commit -m "chore(spm): pin CeraFFI.xcframework for v${VERSION}"
          fi
          SHA=$(git rev-parse HEAD)
          git tag -f "v${VERSION}" "$SHA"
          git push -f origin "refs/tags/v${VERSION}"
          echo "Tag v${VERSION} -> ${SHA} (pinned Package.swift; default branch untouched)"

      # Idempotent: action-gh-release updates an existing tag/release in place
      # and re-uploads assets, so re-running after a partial publish is safe.
      # When the SPM leg ran, the tag already exists (pushed above) at the
      # Package.swift-pinned commit, and softprops attaches the release to it
      # rather than re-creating it at the workflow SHA.
      - name: Create tag and GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          # Assets are attached per-leg; tolerate any absence so a subset
          # release (e.g. crates-only) still cuts the tag.
          fail_on_unmatched_files: false
          files: |
            release-assets/**/cera-*
            release-assets/**/CeraFFI.xcframework.zip

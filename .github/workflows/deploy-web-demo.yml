name: Deploy Web Demo

# Builds `cera_ffi_flutter/example` for the browser and uploads it to Cloudflare
# Pages, so there is a live URL running LFM2 on WebGPU in the visitor's own
# browser. The same build can also go to a Hugging Face static Space instead,
# on request: see "Publishing to the Hugging Face Space" below.
#
# The point of the demo is WebGPU, not "a Flutter app that happens to build".
# The measured gap is ~58 tok/s on WebGPU against ~1.4 tok/s on the wasm CPU
# path, and the CPU path is what you get by accident, silently: the worker
# probes `typeof wasm.WebGpuSession !== 'function'` and falls through to the CPU
# whenever the wasm was built without `--features wgpu`
# (cera_ffi/lib/src/web/cera_worker.js). No error, no console warning, just a
# demo that is 40x slower than the thing it exists to show. That is why this
# workflow builds via `just wasm-web-wgpu` rather than `just wasm-web`, which is
# the same build without the feature, and then asserts the symbol is actually
# present before deploying.
#
# Deployment is Direct Upload from here rather than Cloudflare's own Git
# integration: the artifact needs a Rust nightly toolchain, wasm-pack, binaryen
# and Flutter to exist at all, which Cloudflare's build image does not provide.
# The Pages side therefore only ever receives a finished directory, and none of
# the free plan's build limits (500 builds/month, 20-minute timeout, 1
# concurrent build) apply to it.
#
# ── One-time setup ────────────────────────────────────────────────────────
#
#   1. Create the Pages project once, from a machine with wrangler:
#
#        npx wrangler pages project create cera-demo --production-branch=main
#
#      Not from the dashboard, and pass `--production-branch` explicitly. A
#      Direct Upload project exposes no production-branch control in the
#      dashboard at all, and the value is fixed when the project is created:
#      run the command interactively without the flag and it offers whatever
#      branch you happen to have checked out, which pins the demo's production
#      URL to a feature branch, correctable only through the Update Project
#      API. The project must also exist before the first deploy, since
#      `wrangler pages deploy` can only create one interactively, which in CI
#      surfaces as a failed deploy.
#   2. Create an API token: My Profile > API Tokens > Create Custom Token,
#      with the single permission Account > Cloudflare Pages > Edit.
#   3. Add two repository secrets: CLOUDFLARE_API_TOKEN and
#      CLOUDFLARE_ACCOUNT_ID.
#
#      The account ID is NOT in the dashboard sidebar unless a domain has been
#      added: that panel belongs to a zone's Overview page, and a Pages-only
#      account has no zone, so there is nothing there to read. Two places that
#      work regardless:
#
#        - the dashboard URL, which carries it once you are inside an account:
#          https://dash.cloudflare.com/<32-hex-account-id>/pages
#        - `npx wrangler whoami`, which tables the ID for every account the
#          current login can reach. Handy since step 1 already needs wrangler.
#
# A custom domain needs nothing here. Pages project > Custom domains > Set up a
# domain, and Cloudflare serves it alongside the *.pages.dev URL. A subdomain
# does not require the zone to be on Cloudflare; if DNS lives elsewhere, add the
# domain in the dashboard FIRST and only then point a CNAME at
# <project>.pages.dev, because a CNAME that resolves before the domain is
# associated returns 522.
#
# ── Publishing to the Hugging Face Space ──────────────────────────────────
#
# A Hugging Face Space with `sdk: static` is a git repo whose files are served
# as-is, with no container and no compute behind them, which is why they are
# free for every account and never idle out. That makes it the same artifact
# Cloudflare gets: `flutter build web` output, no build step on their side. So
# it is a second destination on this workflow rather than a second workflow,
# which would otherwise duplicate the toolchain, the WebGpuSession assertion
# and the size walk to produce a byte-identical directory.
#
# It never runs on a push. Cloudflare deploys itself on every push to main;
# the Space is published only by dispatching this workflow by hand with
# `publish_space` checked. A Space is one repo serving one site, so there is no
# per-branch preview to make an automatic deploy safe the way it is for Pages,
# and the publish force-pushes, replacing whatever is live rather than adding
# to it.
#
# Force-pushing a one-commit history keeps the Space's ref shallow but not its
# object store: each publish whose wasm changed leaves the previous LFS objects
# behind, and HF does not collect them. Bounded by how often anyone publishes,
# and clearable with the Hub's super-squash if it ever matters.
#
# A publish dispatch skips the Cloudflare deploy rather than doing both. Not
# tidiness: the Space publish needs a concurrency group that never cancels
# (see below), which puts it outside the branch's group, and two runs in
# different groups can reach `wrangler pages deploy --branch=main` at the same
# time. A publish of an older commit finishing after a push of a newer one
# would then leave the older build live on production. A dispatch that wants a
# Cloudflare redeploy is the same dispatch with the box unchecked.
#
# Any ref may be dispatched, main or not, so the ref is stamped into the Space's
# commit message and the job summary. Without that there is nothing on the Hub
# saying the live site is a branch.
#
# One-time setup, none of which has to exist for this workflow to merge or for
# a Cloudflare deploy to keep working:
#
#   1. Create the Space at huggingface.co/new-space, SDK "Static". Owner and
#      name have to match the `SPACE_ID` env value below. The Space must exist
#      first: pushing to a Space that was never created is a 404, not an
#      implicit create.
#   2. Create a token at huggingface.co/settings/tokens with write access to
#      that Space. A fine-grained token needs "Write access to contents/settings
#      of selected repos" with the Space picked; a classic token needs `write`.
#   3. Add it as the repository secret HF_TOKEN.
#
# The Space's README.md is not authored on the Hub. `.github/hf-space/README.md`
# in this repo is the Space card, YAML frontmatter and all, and it is copied
# into the upload on every publish. Editing the card through the Hub UI works
# right up until the next publish discards it.

# The two path lists are identical and have to stay that way. They are written
# out twice because GitHub Actions rejects YAML anchors in workflow files, so
# `&name` / `*name` is not available to say it once.
on:
  push:
    branches: [main]
    paths:
      - "cera/**"
      - "cera-wasm/**"
      - "cera_ffi/**"
      - "cera_ffi_flutter/**"
      # The recipe that passes `--features wgpu` and the config that carries
      # `+simd128`. Both decide what the deployed engine can do, and an edit to
      # either matches none of the paths above.
      - "justfile"
      - ".cargo/config.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/deploy-web-demo.yml"
      - ".github/actions/install-binaryen/**"
      # The LFS patterns, which are not inert metadata: the size gate parses
      # them and fails on a file it cannot place, so a PR editing only this
      # file (the fix that gate's own error message asks for) has to be able to
      # run that gate. Leave this entry out and such a PR matches no path, runs
      # zero jobs, and merges green.
      #
      # The Space card beside it is deliberately not listed. Nothing on the
      # push path reads it, so a wording change there would otherwise buy a
      # 40-minute rebuild and a production redeploy of a byte-identical
      # artifact. It reaches the Space on the next manual publish, which builds
      # anyway.
      - ".github/hf-space/.gitattributes"
  pull_request:
    branches: [main]
    paths:
      - "cera/**"
      - "cera-wasm/**"
      - "cera_ffi/**"
      - "cera_ffi_flutter/**"
      - "justfile"
      - ".cargo/config.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/deploy-web-demo.yml"
      - ".github/actions/install-binaryen/**"
      - ".github/hf-space/.gitattributes"
  workflow_dispatch:
    inputs:
      publish_space:
        description: "Publish this build to the Hugging Face Space (skips Cloudflare Pages deploy)"
        type: boolean
        default: false

permissions:
  contents: read
  # Lets wrangler-action record a GitHub Deployment, which is what surfaces the
  # preview URL on the PR itself instead of only in the job log.
  deployments: write

# One deploy per branch at a time, newest wins. A superseded commit's upload is
# worthless the moment a newer one starts, and Pages keeps every deployment
# forever otherwise.
#
# A Space publish is the exception, and gets a group of its own. Two publishes
# force-push the same single Space repo, so concurrent ones mean whichever
# finishes last wins rather than whichever commit is newer, and a cancellation
# landing inside `git push --force` can leave the Space holding uploaded LFS
# objects that no ref points at. It waits rather than cancels for that reason.
#
# Keyed on `publish_space` and not on the event, because that is what decides
# which destination a run touches. A dispatch that does not publish is an
# ordinary Cloudflare redeploy and belongs in its branch's group with
# everything else.
#
# Waiting has a depth of one: GitHub holds a single pending run per group, so a
# third publish cancels the queued second. Safe, since a pending run has pushed
# nothing.
concurrency:
  group: ${{ inputs.publish_space && 'web-demo-space-publish' || format('web-demo-{0}', github.ref) }}
  cancel-in-progress: ${{ !inputs.publish_space }}

env:
  PROJECT_NAME: cera-demo
  # The Hugging Face Space this publishes to, `<owner>/<name>`. Its served
  # hostname is derived from this rather than written out a second time; see
  # the publish step.
  SPACE_ID: hyeons-lab/cera-demo
  # Copied into the upload verbatim: the Space card, and the LFS patterns that
  # the size gate reads back out to decide what may exceed 10 MB.
  SPACE_META: .github/hf-space
  # `just wasm-web-wgpu` writes here; `install_web --from` reads it.
  WGPU_PKG: cera-wasm/examples/webgpu/pkg
  APP_DIR: cera_ffi_flutter/example

jobs:
  deploy:
    name: Build and deploy the WebGPU demo
    # Forks cannot see the secrets, so without this guard every fork PR fails on
    # an unauthenticated deploy that was never going to work.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      - uses: ./.github/actions/install-binaryen
      - uses: extractions/setup-just@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build the WebGPU wasm runtime
        # Deliberately does NOT set RUSTFLAGS, unlike ci.yml and publish.yml.
        # An env RUSTFLAGS *replaces* `.cargo/config.toml` rather than appending
        # to it, and the wasm32 entry there is what carries `+simd128`, the only
        # thing keeping the CPU fallback off the scalar path. The
        # `target-cpu=native` problem those workflows set it for cannot arise
        # here anyway: this builds with `--target`, and cargo does not apply
        # `target.<triple>.rustflags` to host artifacts in that case, so the
        # build scripts and proc macros it does compile for the host are
        # unaffected either way.
        run: just wasm-web-wgpu

      - name: Install the runtime into the app's web/ directory
        working-directory: ${{ env.APP_DIR }}
        # `--from` rather than the default download. The default is not broken
        # (publish.yml's `build-web-assets` attaches a wgpu build to every
        # release, which is exactly what `_downloadModule` fetches); it is just
        # the wrong source here. A demo deployed from a commit has to run that
        # commit's engine, not the last tagged one, or the URL stops being
        # evidence about the change that triggered it.
        run: |
          flutter pub get
          dart run cera_ffi_flutter:install_web \
            --from "${GITHUB_WORKSPACE}/${WGPU_PKG}" --force

      - name: Assert the installed runtime is the WebGPU build
        # The one check that separates this demo from a 40x slower one. Without
        # `--features wgpu` the `webgpu` module in cera-wasm/src/lib.rs is not
        # compiled, so wasm-bindgen emits no `WebGpuSession` class into the glue
        # and the worker's probe quietly selects the CPU path.
        run: |
          set -euo pipefail
          GLUE="${APP_DIR}/web/cera/cera_wasm.js"
          if ! grep -q 'export class WebGpuSession' "$GLUE"; then
            echo "::error file=$GLUE::no WebGpuSession in the installed runtime. This is a non-wgpu build and would silently deploy the wasm CPU path (~1.4 tok/s vs ~58). Check that 'just wasm-web-wgpu' still passes --features wgpu."
            exit 1
          fi
          echo "WebGpuSession present: the deployed runtime can reach the GPU"

      - name: Build the Flutter web app
        working-directory: ${{ env.APP_DIR }}
        # `--pwa-strategy=none`: the generated service worker caches the app
        # shell, so a redeployed demo keeps serving the previous build to anyone
        # who has already visited. For a demo that redeploys on every push to
        # main that is a bug, not a feature.
        #
        # `--no-web-resources-cdn`: bundles CanvasKit instead of fetching it
        # from gstatic, which makes the deployment self-contained. This site
        # needs no COOP/COEP headers today (neither the GPU path nor the CPU
        # fallback uses threads, so nothing here wants SharedArrayBuffer), and
        # if the threaded `-mt` build ever becomes the fallback and does, this
        # flag is what makes setting them possible: a cross-origin CanvasKit
        # fetch is exactly what `require-corp` blocks.
        run: flutter build web --release --pwa-strategy=none --no-web-resources-cdn

      - name: Report what is being deployed
        working-directory: ${{ env.APP_DIR }}/build/web
        # Pages rejects any single file over 25 MiB on every plan. Nothing here
        # is close today (bundled CanvasKit is the largest at a few MB, the
        # engine wasm next), but a model accidentally committed into web/ would
        # be, and this names the reason where the upload's own failure would
        # not.
        #
        # The second gate is Hugging Face's: it expects anything over 10 MB to
        # arrive through LFS, and the Space upload tracks `*.wasm` for exactly
        # that reason. Checked here, on one walk we are already doing, rather
        # than at publish time, where the same problem surfaces as a rejected
        # push at the end of a 40-minute job.
        #
        # It fails the build even though publishing the Space is manual, which
        # is deliberate on both counts: a file over 10 MB appearing in a
        # Flutter web build is worth stopping for whoever it inconveniences (it
        # is the same "did a model get committed into web/" canary as the gate
        # above, one threshold down), and if it turns out to be legitimate the
        # fix is one pattern in `.github/hf-space/.gitattributes`.
        #
        # `wc -c` rather than `find -printf`, which is GNU-only: the rest of
        # this repo's CI scripts stay runnable on the macOS machines
        # contributors sanity-check them on, and there is no reason for this one
        # to be the exception. `-n1` runs one `wc` per file so there is never a
        # `total` summary line to filter out; filtering it by name would put the
        # size gate at the mercy of the runner's locale.
        run: |
          set -euo pipefail
          LIMIT=$((25 * 1024 * 1024))
          # Decimal MB, not MiB. HF states the threshold as "10 MB" without
          # saying which, and the two differ by 485 KB. Taking the smaller
          # reading costs nothing (it can only ask for LFS slightly early)
          # while the larger one would leave a band of files that clear this
          # gate and are still refused by the push, which is the exact outcome
          # the gate exists to convert into an early failure.
          LFS_LIMIT=$((10 * 1000 * 1000))
          # The extensions LFS will handle, read out of the file that will do
          # the handling instead of restated here. A gate that carries its own
          # copy of the patterns is not checking the tracking, it is agreeing
          # with itself.
          ATTR="${GITHUB_WORKSPACE}/${SPACE_META}/.gitattributes"
          LFS_EXTS=$(sed -n 's/^\*\.\([A-Za-z0-9_-]\{1,\}\)[[:space:]].*filter=lfs.*/\1/p' "$ATTR" | tr '[:upper:]' '[:lower:]')
          # An empty parse would make the loop below wave everything through
          # while still reporting a pass, so it is the one outcome that cannot
          # be treated as "nothing to check". Reachable without anyone touching
          # this step: reformat a line in `.gitattributes` into a shape the sed
          # no longer matches and the gate retires itself silently.
          if [ -z "$(printf '%s' "$LFS_EXTS" | tr -d '[:space:]')" ]; then
            echo "::error file=${SPACE_META}/.gitattributes::no 'filter=lfs' patterns parsed out of this file, so the 10 MB check below would pass whatever it was given. Keep the '*.ext filter=lfs' shape."
            exit 1
          fi
          # Padded on both sides so the membership test matches whole entries:
          # unpadded, an extension would match any substring of another.
          LFS_LIST=" $(printf '%s' "$LFS_EXTS" | tr '\n' ' ') "
          # `-r` is load-bearing, and its absence is invisible on a Mac: GNU
          # xargs with no input still runs `wc -c` once with no operands, which
          # reads the empty stdin and prints `0`, so the emptiness check below
          # would see "0" rather than "" and wave an empty build through. BSD
          # xargs skips the run on its own and accepts `-r` as a no-op, so this
          # spelling behaves the same in CI and on a contributor's machine.
          SIZES=$(find . -type f -print0 | xargs -0 -r -n1 wc -c | sort -rn)
          # An empty build directory would otherwise sail through the size gate
          # by having nothing to measure, which is the one result it must never
          # report as a pass.
          if [ -z "$SIZES" ]; then
            echo "::error::${APP_DIR}/build/web is empty; flutter build produced nothing"
            exit 1
          fi
          # Walked with a here-string rather than `| head`, so nothing runs in a
          # subshell (the loop assigns SIZE/BIGGEST and accumulates UNTRACKED
          # for the two gates below) and no early-closing pipe can fail the
          # step with SIGPIPE under `pipefail`.
          # `read` splits the count off the front, and because `path` is the
          # last variable it keeps the rest of the line whole, so a filename
          # containing spaces survives into the error message intact.
          rank=0
          UNTRACKED=""
          {
            echo "## Web demo deployment"
            echo
            echo "| file | size |"
            echo "|---|---|"
            while read -r bytes path; do
              rank=$((rank + 1))
              if [ "$rank" -eq 1 ]; then
                SIZE=$bytes
                BIGGEST=$path
              fi
              if [ "$rank" -le 5 ]; then
                echo "| \`${path#./}\` | $((bytes / 1024)) KB |"
              fi
              if [ "$bytes" -gt "$LFS_LIMIT" ]; then
                # Matched on the bare filename, because every other spelling
                # finds a dot that is not an extension separator: `find .`
                # prefixes each path with `./`, and a directory component may
                # contain a dot of its own. Either would send a dotless
                # `NOTICES` down the has-an-extension arm.
                rel="${path#./}"
                case "${rel##*/}" in
                  *.*) ext="${rel##*.}" ;;
                  *) ext="" ;;
                esac
                ext=$(printf '%s' "$ext" | tr '[:upper:]' '[:lower:]')
                if [ -n "$ext" ]; then
                  case "$LFS_LIST" in
                    *" $ext "*) ;;
                    # Collected rather than reported: this loop's output is the
                    # job summary table, and an error line belongs in the log.
                    *) UNTRACKED="${UNTRACKED}  ${rel} ($bytes bytes)"$'\n' ;;
                  esac
                else
                  UNTRACKED="${UNTRACKED}  ${rel} ($bytes bytes)"$'\n'
                fi
              fi
            done <<< "$SIZES"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          # Cloudflare's limit is checked first because it is the one that
          # blocks the always-on deploy. A stray model in `web/` trips both, and
          # in the other order the only message printed would be the LFS one,
          # whose advice is to add a pattern: following it satisfies that gate
          # and surfaces the Cloudflare failure a run later.
          if [ "$SIZE" -gt "$LIMIT" ]; then
            # Bytes, not a rounded unit: any rounding makes a file barely over
            # the limit read as exactly the limit, which reads as a false
            # positive to whoever has to act on it.
            echo "::error::${BIGGEST#./} is $SIZE bytes, over Cloudflare Pages' 25 MiB ($LIMIT bytes) per-file limit"
            exit 1
          fi
          if [ -n "$UNTRACKED" ]; then
            # `%0A` is how an annotation carries a newline, so the filenames
            # ride inside the error rather than as loose log lines below it.
            # Annotations are surfaced at the top of the run, which is the only
            # place a reader is guaranteed to look.
            # Two expansions because bash does not nest them: drop the trailing
            # newline every entry was appended with, then turn the separators
            # into `%0A`.
            LIST="${UNTRACKED%$'\n'}"
            echo "::error::these files are over $LFS_LIMIT bytes and would be pushed to the Hugging Face Space outside LFS:%0A${LIST//$'\n'/%0A}"
            echo "::error::add a '*.ext filter=lfs' pattern for them to ${SPACE_META}/.gitattributes, or rename/reduce files over 10 MB that lack an extension. The pattern check requires top-level '*.ext filter=lfs' lines."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        # Skipped when this run is publishing the Space, so the two
        # destinations are never uploaded to by the same run. The header
        # explains why that separation is load-bearing rather than cosmetic.
        if: !inputs.publish_space
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # `--branch` is what decides production vs preview. The project's
          # production branch is `main`, so pushes there land on the custom
          # domain and every other branch gets its own preview URL.
          #
          # No `--commit-dirty`. Everything this job writes is gitignored
          # (`web/cera/`, `build/`, `pubspec.lock`, the wasm-pack output), so
          # the tree is clean and wrangler records that accurately on its own.
          # Passing the flag would not guard against anything (a dirty tree
          # warns, it does not block) and would stamp every deployment as dirty
          # whether it is or not.
          command: >-
            pages deploy ${{ env.APP_DIR }}/build/web
            --project-name=${{ env.PROJECT_NAME }}
            --branch=${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Publish to the Hugging Face Space
        id: space
        # Only ever from a hand-dispatched run that asked for it. See
        # "Publishing to the Hugging Face Space" in the header for why this is
        # not on the push path with Cloudflare, and for the one-time setup that
        # has to exist before it can succeed.
        if: github.event_name == 'workflow_dispatch' && inputs.publish_space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          # An explicit publish request that finds no credentials is a failure,
          # not something to skip past: the caller ticked a box asking for this,
          # and would otherwise read a green run as a deploy that happened.
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::publish_space was requested but the HF_TOKEN secret is empty. Create the Space and the token first; the header of this file has the steps."
            exit 1
          fi

          # Staged in RUNNER_TEMP rather than turning `build/web` itself into a
          # git repo. The push below authenticates via http.extraheader Bearer
          # auth, and `build/web` is the directory this job hands to an uploader.
          # Keeping the git metadata completely isolated in RUNNER_TEMP ensures
          # no uploaded artifacts contain repository or credential state.
          SPACE_DIR="${RUNNER_TEMP}/hf-space"
          rm -rf "$SPACE_DIR"
          mkdir -p "$SPACE_DIR"
          # `/.` for the source, because `dir/*` leaves dotfiles behind.
          cp -R "${APP_DIR}/build/web/." "$SPACE_DIR/"
          # The card and the LFS patterns live in this repo and are versioned
          # with the app they describe, so they are copied in rather than left
          # to whatever the Space happens to hold.
          cp "${SPACE_META}/README.md" "$SPACE_DIR/"
          cp "${SPACE_META}/.gitattributes" "$SPACE_DIR/"
          cd "$SPACE_DIR"

          # A fresh repo force-pushed over the Space, rather than cloning it and
          # syncing files in. Cloning means reconciling deletions by hand (a
          # file that leaves the Flutter output would otherwise be served
          # forever) and pulling down every wasm the Space has ever held. This
          # keeps the published history one commit deep and makes the upload
          # exactly the directory that was built.
          #
          # `-b main`: Spaces serve their default branch, and a repo initialized
          # under git's older default would push a `master` nobody looks at.
          git init -q -b main
          # After `git init`, since `--local` writes the lfs filters into this
          # repo's config, and before `git add`, since those filters are what
          # turn the `.gitattributes` copied above into pointer files.
          git lfs install --local
          git add -A
          git \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Deploy ${GITHUB_REF_NAME} (${GITHUB_SHA}) from ${GITHUB_REPOSITORY}"

          # A named remote, not a URL passed straight to `git push`. The URL
          # form looks tidier and silently breaks LFS: git-lfs resolves its
          # batch endpoint from a remote, and with an ad-hoc URL it has none to
          # resolve, so the push fails with `batch request: missing protocol`
          # after the pointer files are already committed.
          #
          # The token is passed via http.extraheader Bearer authorization so the
          # remote URL contains no credentials, protecting against token leaks in
          # git-lfs traces or terminal error diagnostics.
          git remote add space "https://huggingface.co/spaces/${SPACE_ID}"
          git -c "http.extraheader=Authorization: Bearer ${HF_TOKEN}" push --force --quiet space main

          # A static Space is served from `<owner>-<name>.static.hf.space`,
          # lowercased. Derived instead of written out again so that changing
          # SPACE_ID cannot leave this pointing at the previous Space, which
          # would still resolve and still look fine. Besides alphanumerics an
          # owner or name may hold `-`, `_` or `.`, and a host may hold only
          # `-`, so the latter two fold to it along with the separating slash.
          HOST=$(printf '%s' "$SPACE_ID" | tr '[:upper:]' '[:lower:]' | tr '/_.' '---')
          echo "url=https://${HOST}.static.hf.space" >> "$GITHUB_OUTPUT"

      - name: Link the deployment
        # `always()`, with each destination reported only if it ran and a
        # failed publish reported as failed. A condition naming either deploy
        # step would go silent on the run that needs a summary most: the
        # publish dispatch, which skips Cloudflare, so gating on that step
        # would suppress the Space result along with it.
        if: always()
        env:
          PAGES_URL: ${{ steps.deploy.outputs.deployment-url }}
          SPACE_URL: ${{ steps.space.outputs.url }}
          SPACE_OUTCOME: ${{ steps.space.outcome }}
        run: |
          set -euo pipefail
          # No URL and no publish attempt means nothing was deployed, usually
          # because the job failed on its way here. Nothing to add that the
          # failing step has not already said.
          if [ -z "${PAGES_URL:-}" ] && [ "${SPACE_OUTCOME:-skipped}" = "skipped" ]; then
            exit 0
          fi
          {
            echo
            if [ -n "${PAGES_URL:-}" ]; then
              echo "Deployed: ${PAGES_URL}"
            fi
            case "${SPACE_OUTCOME:-skipped}" in
              skipped) ;;
              success)
                echo
                echo "Hugging Face Space: ${SPACE_URL}"
                echo "Space page: https://huggingface.co/spaces/${SPACE_ID}"
                # Worth stating plainly, because the Space has no per-branch
                # previews: whatever ref was dispatched is now the live site.
                echo
                echo "The Space now serves \`${GITHUB_REF_NAME}\`."
                ;;
              *)
                echo
                # Neither "was not updated" nor "still serves what it did":
                # a cancellation can land inside the force push, so what the
                # Space holds afterwards is not something this job knows.
                echo "The publish step \`${SPACE_OUTCOME}\`, so the Space may not"
                echo "hold this build. Check https://huggingface.co/spaces/${SPACE_ID}."
                ;;
            esac
            echo
            echo "Pick an **LFM2** GGUF: \`WebGpuSession\` is LFM2-only, so any"
            echo "other architecture falls back to the wasm CPU path."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

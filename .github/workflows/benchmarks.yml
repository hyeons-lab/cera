name: Benchmarks

# Regular, consistent throughput logs for the LFM2 quants cera ships
# (Q4_0 / Q4_K_M / Q8_0), on CPU and on both GPU backends, so perf regressions
# and wins are visible over time.
#
# Runs on:
#   - a nightly schedule (fixed-cadence baseline),
#   - every push to main that touches the compute kernels or model forward paths
#     (per-merge tracking — the "did this change move prefill/decode" signal),
#   - manual dispatch (with overridable prompt length / run count).
#
# Three runners. CPU: `ubuntu-24.04-arm` (Neoverse N2, FEAT_I8MM — where the
# aarch64 SMMLA GEMM kernels actually execute, closest to the mobile target) and
# `ubuntu-latest` (x86_64 desktop baseline). GPU: `macos-latest` (Apple Silicon,
# the only hosted runner with a real GPU). Absolute tok/s on shared CI runners
# drifts; the durable signals are the resolved backend (CPU tier, or the GPU
# adapter, logged each run) and relative movement across commits for the same
# runner + device + quant. Results land in
# the job summary (a markdown table) and as a `bench-results.json` artifact in
# github-action-benchmark's customBiggerIsBetter format, ready for trend
# tracking / regression alerts to be layered on later.
#
# Alongside the CPU matrix there are two GPU jobs: `gpu-bench`, the same
# end-to-end sweep against
# both the native `metal` and the portable `gpu` (wgpu) backends, and
# `gpu-gemm-microbench`, which times the wgpu prefill GEMM in isolation. The
# microbench exists because the kernel is where wgpu perf has actually moved by
# orders of magnitude, and an end-to-end number dilutes that.
#
# **What this workflow can and cannot see.** Kernel work shows up here: the
# `arm64-i8mm` runner is the one where the aarch64 SMMLA GEMM kernels actually
# execute, and the push trigger covers `cera/src/backend/**`, so a change to
# those kernels moves these numbers on the next merge. Core-topology *scheduling*
# work does not show up here, and cannot: capacity-aware chunk sizing scales a
# worker's chunk by its core's weight, and the prefill pool drops pinning once it
# is wider than the fast-core count. Both are no-ops on a host whose cores are
# all the same speed, and every hosted runner is that host. Each run prints its
# resolved topology (`cores: ... placement=...`) next to the tier for exactly
# this reason: where that reads `flat`, a level trend is not evidence scheduling
# work achieved nothing, it is evidence this host cannot express it. Those
# changes are measured on real big.LITTLE hardware and recorded in
# `benchmarks/BASELINE.md` instead.
#
# Each CPU run also benchmarks upstream **llama.cpp** on the *same* GGUFs (pinned
# commit, built once and cached, native ISA to match cera's runtime dispatch) and
# adds `llama` + `gap (llama/cera)` columns to the summary table. This is
# best-effort context, not a gate: if the llama build or a model load fails, the
# comparison degrades to `n/a` and the cera measurement (the tracked JSON) is
# unaffected. The gap is the competitive signal the isolated cera numbers lack.

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC nightly
  workflow_dispatch:
    inputs:
      prompt_tokens:
        description: "Prefill length (tokens)"
        default: "512"
      runs:
        description: "Measured runs per quant"
        default: "10"
  push:
    branches: [main]
    paths:
      - "cera/src/backend/**"
      - "cera/src/model/**"
      - "cera/src/quant.rs"
      - "cera/src/tensor.rs"
      - "cera/examples/wgpu_gemm_bench.rs"
      - "scripts/ci-bench.sh"
      - ".github/workflows/benchmarks.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Override .cargo/config.toml target-cpu=native — CI runners vary, and we want
  # the runtime-dispatched kernels (the shipped binaries' behavior), not a build
  # pinned to one runner's microarch.
  RUSTFLAGS: ""
  # Upstream llama.cpp pin for the head-to-head — a commit verified to support the
  # `lfm2` arch these bundles use. Single source of truth: both the build step and
  # both llama.cpp cache keys interpolate it, so bumping the pin (and `-v<n>`)
  # here re-keys the cache automatically — no separate SHA-prefix to keep in sync.
  LLAMA_COMMIT: fb38d6f278a4a391b8db1a16ee5946db3766459c

jobs:
  cpu-bench:
    name: CPU bench (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64-i8mm
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
      - uses: Swatinem/rust-cache@v2
      - name: Build release CLI
        run: cargo build --release -p cera-cli
      # Restore/save split (not `actions/cache`) so the model cache is only saved
      # after a *successful* bench — a failed or partial download can't freeze a
      # corrupt ~/.cache/cera under the key and poison every future run. Keyed per
      # arch to avoid the two matrix jobs racing on one key.
      - name: Restore model bundles
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/cera
          key: bench-models-LFM2.5-350M-${{ matrix.arch }}-v1
      # Upstream llama.cpp for the head-to-head, pinned (`LLAMA_COMMIT`, top-level
      # env) + cached + built native so it runs the same ISA cera's runtime
      # dispatch picks. The whole thing is best-effort (`continue-on-error` on both
      # build and save): a failure leaves `LLAMA_BENCH` unset, so `ci-bench.sh`
      # runs cera-only and the job still passes. Both cache keys interpolate
      # `LLAMA_COMMIT`, so bumping the pin re-keys them automatically.
      - name: Restore llama.cpp build
        id: llama-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/llamacpp/build
          key: llamacpp-${{ env.LLAMA_COMMIT }}-${{ matrix.runner }}-v1
      - name: Build llama.cpp (llama-bench)
        id: llama
        continue-on-error: true
        run: |
          set -e
          BENCH="$HOME/llamacpp/build/bin/llama-bench"
          # Rebuild if the binary is missing OR a *cached* one can no longer run
          # (e.g. the runner image bumped glibc/libstdc++ under it) — `-h` exits 0
          # on a healthy binary and non-zero if it can't even load, so this
          # self-heals on an image change instead of serving a dead binary until
          # the cache key is bumped by hand.
          if [ ! -x "$BENCH" ] || ! "$BENCH" -h >/dev/null 2>&1; then
            rm -rf "$HOME/llamacpp"
            # Shallow single-commit fetch — pulls just the pinned tree, not the
            # full history (github.com allows fetching a specific SHA). Only runs
            # on a cache miss / self-heal, so the saving is a rare-path speedup.
            git init -q "$HOME/llamacpp"
            git -C "$HOME/llamacpp" fetch -q --depth 1 \
              https://github.com/ggml-org/llama.cpp.git "$LLAMA_COMMIT"
            git -C "$HOME/llamacpp" checkout -q FETCH_HEAD
            cmake -S "$HOME/llamacpp" -B "$HOME/llamacpp/build" \
              -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON \
              -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF \
              -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF
            cmake --build "$HOME/llamacpp/build" --target llama-bench -j"$(nproc)"
          fi
          echo "LLAMA_BENCH=$BENCH" >> "$GITHUB_ENV"
      # Save only on a fresh build (cache miss) — re-saving an existing key is a
      # `ReserveCacheError` warning at best. `continue-on-error` so a transient
      # cache-service failure never fails the (already-measured) benchmark job.
      - name: Save llama.cpp build
        if: steps.llama.outcome == 'success' && steps.llama-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/llamacpp/build
          key: llamacpp-${{ env.LLAMA_COMMIT }}-${{ matrix.runner }}-v1
      - name: Run CPU benchmarks
        env:
          BIN: ./target/release/cera
          ARCH_LABEL: ${{ matrix.arch }}
          BUNDLE_ID: LFM2.5-350M
          QUANTS: "Q4_0 Q4_K_M Q8_0"
          PROMPT_TOKENS: ${{ github.event.inputs.prompt_tokens || '512' }}
          RUNS: ${{ github.event.inputs.runs || '10' }}
          WARMUP: "2"
          MAX_TOKENS: "32"
          # Thread count is left at each engine's *shipping default* — cera
          # auto-calibrates (and its decode pool's optimum is not always all-core,
          # so forcing a fixed count would measure something other than what ships),
          # and llama-bench uses its own default. The comparison is therefore
          # "cera as shipped vs llama as shipped". On a hyperthreaded runner the two
          # defaults can differ (cera counts logical cores, llama physical), so read
          # the gap as indicative, not a controlled micro-benchmark — consistent
          # with this job's stated "relative movement across commits" purpose.
          # (`LLAMA_THREADS` in ci-bench.sh can pin llama-bench if ever needed.)
        run: bash scripts/ci-bench.sh
      # Save only on success — a failed bench (e.g. total download outage) leaves
      # the cache untouched rather than persisting a partial ~/.cache/cera.
      - name: Save model bundles
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/cera
          key: bench-models-LFM2.5-350M-${{ matrix.arch }}-v1
      # `always()` so results (including the partial/empty JSON the script writes
      # before failing) upload even when the bench step fails — without it the
      # step defaults to `if: success()` and the `if-no-files-found: error` guard
      # can never fire.
      - name: Upload results JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-results-${{ matrix.arch }}
          path: bench-results.json
          if-no-files-found: error

  # End-to-end GPU throughput, both backends, on the only hosted runner with a
  # real GPU (macos-latest is Apple Silicon). `metal` is the native backend;
  # `gpu` is the portable wgpu one, which is the number that historically drifts
  # — it ran ~100x behind Metal on prefill until the reg-tile GEMM was rewritten
  # to keep its accumulators in registers, and nothing in CI would have caught
  # that. Both devices run the same `ci-bench.sh` as the CPU job, so the table,
  # JSON and summary formats match.
  #
  # No llama.cpp overlay here: `LLAMA_BENCH` is left unset, so the script runs
  # cera-only. Metal-vs-Metal against upstream is worth adding later, but it is a
  # separate build (and a separate argument about thread/backend defaults) from
  # what this job is for, which is tracking cera against its own history.
  gpu-bench:
    name: GPU bench (${{ matrix.device }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        device: [metal, gpu]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
      # rust-cache keys on `github.job`, which is identical for both matrix
      # legs, so they share an entry either way. `shared-key` just makes that
      # explicit and stable rather than incidental: the two legs build the same
      # artifacts (`--features gpu,metal`) and differ only in `--device`.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gpu-bench
      - name: Build release CLI (gpu + metal)
        run: cargo build --release -p cera-cli --features gpu,metal
      # One key for both legs: they download the byte-identical bundle. (The CPU
      # job keys per-arch because those are different runners with different
      # binaries; here only the `--device` flag differs.)
      - name: Restore model bundles
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/cera
          key: bench-models-LFM2.5-350M-macos-v1
      - name: Run GPU benchmarks
        env:
          BIN: ./target/release/cera
          ARCH_LABEL: macos-arm64
          DEVICE: ${{ matrix.device }}
          BUNDLE_ID: LFM2.5-350M
          QUANTS: "Q4_0 Q4_K_M Q8_0"
          PROMPT_TOKENS: ${{ github.event.inputs.prompt_tokens || '512' }}
          RUNS: ${{ github.event.inputs.runs || '10' }}
          WARMUP: "2"
          MAX_TOKENS: "32"
          # Adapter identity is logged at info by each backend, under its own
          # target — without it the run records only `device=metal|gpu` and a
          # runner-image GPU swap would be invisible in the trend. The leading
          # `warn` matters: a target-only directive sets the global default to
          # OFF, which would silence the deliberately-loud "no batched prefill
          # GEMM for this dtype" warning that announces the exact regression
          # this job hunts.
          RUST_LOG: "warn,cera::backend::wgpu=info,cera::backend::metal=info"
        run: bash scripts/ci-bench.sh
      - name: Save model bundles
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/cera
          key: bench-models-LFM2.5-350M-macos-v1
      - name: Upload results JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-results-gpu-${{ matrix.device }}
          path: bench-results.json
          if-no-files-found: error

  # Kernel-level guard for the wgpu prefill GEMM.
  #
  # The end-to-end job above would catch a big regression, but it mixes the GEMM
  # with attention, conv, norms and the LM head, and it depends on a model
  # download. This runs `mul_mat_reg_tile` alone on the real LFM2 projection
  # shapes and reports GFLOP/s per dtype, so a change that puts the accumulators
  # back in thread-local memory (~76 GFLOP/s vs ~1300 on an M-series GPU — an
  # order of magnitude, not a few percent) shows up as an unmissable number with
  # no model and no network.
  gpu-gemm-microbench:
    name: GPU GEMM microbench
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-10
      - uses: Swatinem/rust-cache@v2
      # Build and run as separate steps, and capture stdout only: piping
      # `cargo run 2>&1` would fold the whole compile log into `gemm-bench.txt`
      # and from there into the job summary on any cache miss.
      - name: Build microbenchmark
        run: cargo build --release -p cera --features gpu --example wgpu_gemm_bench
      - name: Run mul_mat_reg_tile microbenchmark
        run: |
          set -euo pipefail
          ./target/release/examples/wgpu_gemm_bench | tee gemm-bench.txt
      # customBiggerIsBetter, same shape as the throughput jobs' JSON, so all
      # three feed one trend view. Keyed by dtype+shape since that is the axis a
      # kernel regression moves.
      - name: Convert to benchmark JSON
        if: always()
        run: |
          set -euo pipefail
          # The run step may never have executed (checkout/toolchain failure), in
          # which case there is nothing to convert and failing here would mask
          # the real error.
          [ -f gemm-bench.txt ] || { echo "no gemm-bench.txt — skipping"; exit 0; }
          # Anchor on the "<number> GFLOP/s" token rather than a field offset:
          # `SHADER=` diff mode appends a trailing `rel_err=...`, which would
          # silently shift $(NF-1) onto the wrong value.
          {
            echo "["
            awk '
              match($0, /[0-9.]+ GFLOP\/s/) {
                v = substr($0, RSTART, RLENGTH); sub(/ GFLOP\/s/, "", v)
                printf "%s  {\"name\": \"gemm %s %s\", \"unit\": \"GFLOP/s\", \"value\": %s}",
                       (n++ ? ",\n" : ""), $1, $2, v
              }
              END { printf "\n" }
            ' gemm-bench.txt
            echo "]"
          } > gemm-bench.json
          cat gemm-bench.json
      - name: Summary
        if: always()
        run: |
          [ -f gemm-bench.txt ] || exit 0
          {
            echo "### wgpu \`mul_mat_reg_tile\` microbench (macos-arm64)"
            echo
            echo '```'
            cat gemm-bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gemm-bench-results
          path: |
            gemm-bench.json
            gemm-bench.txt
          # `warn`, not `error`: the guards above intentionally produce no files
          # when the benchmark step never ran, and that case is already reported
          # by the failing step itself.
          if-no-files-found: warn

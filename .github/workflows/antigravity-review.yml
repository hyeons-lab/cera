name: Antigravity Code Review

on:
  pull_request:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  antigravity-review:
    name: Antigravity Code Review
    runs-on: ubuntu-latest
    if: |
      (github.actor != 'dependabot[bot]') && (
        (github.event_name == 'pull_request' && (github.event.action == 'opened' || contains(github.event.pull_request.labels.*.name, 'needs antigravity review') || contains(github.event.pull_request.labels.*.name, 'antigravity-review'))) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && (contains(github.event.comment.body, '@antigravity') || contains(github.event.comment.body, '@Antigravity')) && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && (contains(github.event.comment.body, '@antigravity') || contains(github.event.comment.body, '@Antigravity')) && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Antigravity Code Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.ANTIGRAVITY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/antigravity_review.py
